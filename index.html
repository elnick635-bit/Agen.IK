let boardOpenId=null;
const BOARD_DB="agenik-board-files-v1",BOARD_STORE="files";
const BOARD_SURFACE_W=2600,BOARD_SURFACE_H=1900,BOARD_HOME_W=2200,BOARD_HOME_H=1400;
const boardsOf=()=>Array.isArray(state.boards)?state.boards:[];
const boardById=id=>boardsOf().find(b=>b.id===id)||null;
function uid(prefix){return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function boardClamp(v,min,max){return Math.max(min,Math.min(max,v))}
function boardDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(BOARD_DB,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(BOARD_STORE))db.createObjectStore(BOARD_STORE,{keyPath:"id"})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function boardFilePut(file){const db=await boardDb(),id=uid("bf_");await new Promise((res,rej)=>{const tx=db.transaction(BOARD_STORE,"readwrite");tx.objectStore(BOARD_STORE).put({id,name:file.name||"archivo",mime:file.type||"application/octet-stream",size:file.size||0,blob:file,createdAt:Date.now()});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close();return id}
async function boardFileGet(id){if(!id)return null;try{const db=await boardDb();const v=await new Promise((res,rej)=>{const r=db.transaction(BOARD_STORE).objectStore(BOARD_STORE).get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)});db.close();return v}catch(e){return null}}
async function boardFileDelete(id){if(!id)return;try{const db=await boardDb();await new Promise((res,rej)=>{const tx=db.transaction(BOARD_STORE,"readwrite");tx.objectStore(BOARD_STORE).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}catch(e){}}
function boardPersist(){state.updatedAt=Date.now();if(persist())flashSaved()}
function boardTouch(b){b.updatedAt=Date.now();boardPersist()}
function boardItemCount(b){return (b.items||[]).length+(b.sections||[]).length}
function boardWhen(ts){if(!ts)return"—";const d=new Date(ts),n=new Date();if(d.toDateString()===n.toDateString())return"hoy";const y=new Date();y.setDate(y.getDate()-1);if(d.toDateString()===y.toDateString())return"ayer";return d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3)}
function boardSizeLimits(type){
  if(type==="section")return{minW:300,minH:190,maxW:1400,maxH:1050};
  if(type==="image")return{minW:150,minH:110,maxW:980,maxH:760};
  if(type==="pdf")return{minW:210,minH:92,maxW:680,maxH:420};
  return{minW:180,minH:120,maxW:620,maxH:520};
}
function boardNormalizeRect(o,type){const l=boardSizeLimits(type);o.width=boardClamp(Number(o.width)||l.minW,l.minW,l.maxW);o.height=boardClamp(Number(o.height)||l.minH,l.minH,l.maxH);o.x=boardClamp(Number(o.x)||0,0,Math.max(0,BOARD_SURFACE_W-o.width));o.y=boardClamp(Number(o.y)||0,0,Math.max(0,BOARD_SURFACE_H-o.height))}
function ensureBoardShape(b){
  b.items=Array.isArray(b.items)?b.items:[];b.sections=Array.isArray(b.sections)?b.sections:[];
  b.view=b.view&&typeof b.view==="object"?b.view:{panX:80,panY:90,scale:1};
  if(!Number.isFinite(b.view.panX))b.view.panX=80;if(!Number.isFinite(b.view.panY))b.view.panY=90;if(!Number.isFinite(b.view.scale))b.view.scale=1;b.view.scale=boardClamp(b.view.scale,.35,2);
  if(!b.color)b.color="#3F9E63";if(!b.icon)b.icon="▦";
  b.sections.forEach(s=>{if(!s.id)s.id=uid("bs_");if(!s.title)s.title="SECCIÓN";boardNormalizeRect(s,"section")});
  const validSections=new Set(b.sections.map(s=>s.id));
  b.items.forEach(it=>{if(!it.id)it.id=uid("bi_");if(!["note","image","pdf"].includes(it.type))it.type="note";if(!Number.isFinite(it.zIndex))it.zIndex=5;if(it.sectionId&&!validSections.has(it.sectionId))it.sectionId=null;boardNormalizeRect(it,it.type)});
}
function boardHomeView(){state.settings=state.settings||{};const v=state.settings.boardsView&&typeof state.settings.boardsView==="object"?state.settings.boardsView:(state.settings.boardsView={panX:42,panY:88,scale:1});if(!Number.isFinite(v.panX))v.panX=42;if(!Number.isFinite(v.panY))v.panY=88;if(!Number.isFinite(v.scale))v.scale=1;v.scale=boardClamp(v.scale,.55,1.6);return v}
function boardHomeDefaultPosition(i){const col=i%4,row=Math.floor(i/4);return{x:80+col*330,y:120+row*205}}
function ensureBoardHomePositions(){let changed=false;boardsOf().forEach((b,i)=>{if(!Number.isFinite(b.homeX)||!Number.isFinite(b.homeY)){const p=boardHomeDefaultPosition(i);b.homeX=p.x;b.homeY=p.y;changed=true}b.homeX=boardClamp(b.homeX,0,BOARD_HOME_W-300);b.homeY=boardClamp(b.homeY,0,BOARD_HOME_H-160)});if(changed)boardPersist()}
function boardCenter(b,viewport){ensureBoardShape(b);return{x:(viewport.clientWidth/2-b.view.panX)/b.view.scale,y:(viewport.clientHeight/2-b.view.panY)/b.view.scale}}
function boardApplyTransform(v,surface){surface.style.transform=`translate(${v.panX}px,${v.panY}px) scale(${v.scale})`}
function boardZoomAt(v,viewport,surface,newScale,clientX,clientY,minScale,maxScale){const rect=viewport.getBoundingClientRect(),lx=(clientX==null?rect.left+viewport.clientWidth/2:clientX)-rect.left,ly=(clientY==null?rect.top+viewport.clientHeight/2:clientY)-rect.top,old=v.scale||1,wx=(lx-v.panX)/old,wy=(ly-v.panY)/old;v.scale=boardClamp(newScale,minScale,maxScale);v.panX=lx-wx*v.scale;v.panY=ly-wy*v.scale;boardApplyTransform(v,surface)}
function setupBoardViewportGestures(viewport,surface,v,onSave,opts){
  opts=Object.assign({minScale:.35,maxScale:2},opts||{});const active=new Map();let panStart=null,pinchStart=null,wheelTimer=null;
  const background=e=>!e.target.closest(".board-item,.board-section-head,.board-resize,.board-toolbar,.board-fab,.board-zoom,.board-card,.boards-lobby-toolbar");
  const startPinch=()=>{if(active.size<2)return;const ps=[...active.values()].slice(0,2),rect=viewport.getBoundingClientRect(),mx=(ps[0].x+ps[1].x)/2-rect.left,my=(ps[0].y+ps[1].y)/2-rect.top;pinchStart={dist:Math.max(1,Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y)),scale:v.scale,worldX:(mx-v.panX)/v.scale,worldY:(my-v.panY)/v.scale};panStart=null;viewport.classList.add("panning")};
  viewport.addEventListener("pointerdown",e=>{if(e.button!=null&&e.button!==0)return;if(!background(e))return;e.preventDefault();active.set(e.pointerId,{x:e.clientX,y:e.clientY});try{viewport.setPointerCapture(e.pointerId)}catch(_e){}if(active.size===1){panStart={id:e.pointerId,x:e.clientX,y:e.clientY,panX:v.panX,panY:v.panY};pinchStart=null;viewport.classList.add("panning")}else startPinch()});
  viewport.addEventListener("pointermove",e=>{if(!active.has(e.pointerId))return;active.set(e.pointerId,{x:e.clientX,y:e.clientY});if(active.size>=2){if(!pinchStart)startPinch();const ps=[...active.values()].slice(0,2),rect=viewport.getBoundingClientRect(),dist=Math.max(1,Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y)),mx=(ps[0].x+ps[1].x)/2-rect.left,my=(ps[0].y+ps[1].y)/2-rect.top,newScale=boardClamp(pinchStart.scale*dist/pinchStart.dist,opts.minScale,opts.maxScale);v.scale=newScale;v.panX=mx-pinchStart.worldX*newScale;v.panY=my-pinchStart.worldY*newScale;boardApplyTransform(v,surface);return}if(panStart&&e.pointerId===panStart.id){v.panX=panStart.panX+(e.clientX-panStart.x);v.panY=panStart.panY+(e.clientY-panStart.y);boardApplyTransform(v,surface)}});
  const end=e=>{if(!active.has(e.pointerId))return;active.delete(e.pointerId);try{viewport.releasePointerCapture(e.pointerId)}catch(_e){}if(active.size>=2){startPinch();return}if(active.size===1){const [id,p]=[...active.entries()][0];panStart={id,x:p.x,y:p.y,panX:v.panX,panY:v.panY};pinchStart=null;return}panStart=null;pinchStart=null;viewport.classList.remove("panning");onSave?.()};
  viewport.addEventListener("pointerup",end);viewport.addEventListener("pointercancel",end);

function statsGlobalStreak(hs){
  if(!hs.length)return {cur:0,best:0,bs:null,be:null,first:null};
  const t=iso(today());let first=t;
  hs.forEach(h=>{if(h.since&&h.since<first)first=h.since});
  const days=first<=t?daysRange(first,t):[t];
  let run=0,runStart=null,best=0,bs=null,be=null;
  days.forEach(d=>{
    const act=hs.filter(h=>counts(h,d)),ok=act.length&&act.every(h=>done(h,d));

}

  return {known:true,df,cls:df>2?"up":(df<-2?"down":""),icon:df>2?"↑":(df<-2?"↓":"→"),txt:df>2?"mejorando":(df<-2?"bajando":"estable")};
}


/* ---------------- CUMPLIMIENTO mes a mes ---------------- */
let cmpYear=new Date().getFullYear();
function monthPct(y,m){
  const days=monthDays(new Date(y,m,1));
  return rangeStats(statsHabitsOf(),days);
}
function cumplimientoCard(){
  const c=el("div","card");
  c.appendChild(el("h2","","Cumplimiento"));
  c.appendChild(el("div","sub","tu porcentaje general mes a mes"));

  const bar=el("div","yearbar");
  const pv=el("button","mini","‹");
  const yl=el("div","y",String(cmpYear));
  const nx=el("button","mini","›");
  const nowY=new Date().getFullYear();
  pv.onclick=()=>{cmpYear--;render()};
  nx.onclick=()=>{if(cmpYear<nowY){cmpYear++;render()}};
  if(cmpYear>=nowY){nx.style.opacity=".35"}
  bar.append(pv,yl,nx);c.appendChild(bar);

  const list=el("div","cmp");
  const nowM=new Date().getMonth();
  let sum=0,n=0,best=null;
  for(let m=0;m<12;m++){
    if(cmpYear===nowY&&m>nowM) break;
    const st=monthPct(cmpYear,m);
    const r=el("div","r"+(cmpYear===nowY&&m===nowM?" now":""));
    r.appendChild(el("div","mn",cap(MONTHS[m])));
    const tk=el("div","tk");const fi=el("i");
    const has=st.tot>0;
    fi.style.width=(has?st.pct:0)+"%";
    fi.style.background=st.pct>=80?"var(--ok)":"var(--ink)";
    tk.appendChild(fi);r.appendChild(tk);
    const p=el("div","pv"+(has?"":" na"),has?st.pct+"%":"—");
    if(has&&st.pct>=80)p.style.color="var(--ok)";
    r.appendChild(p);
    list.appendChild(r);
    if(has){sum+=st.pct;n++;if(!best||st.pct>best.pct)best={m,pct:st.pct}}
  }
  c.appendChild(list);

  const ch=el("div","chips");
  ch.appendChild(chip("Promedio del año","<b>"+(n?Math.round(sum/n):0)+"%</b>"));
  if(best) ch.appendChild(chip("Tu mejor mes","<b>"+cap(MONTHS[best.m])+" "+best.pct+"%</b>"));
  c.appendChild(ch);
  return c;
}

function habitHeatmap(h){
  const WEEKS=20;
  const end=startWeek(new Date());
  const start=addDays(end,-7*(WEEKS-1));
  const sc=el("div","scroller");sc.style.paddingBottom="4px";
  const wr=el("div","hmwrap");
  const mons=el("div","hmmonths");
  let lastM=-1;
  for(let w=0;w<WEEKS;w++){
    const d=addDays(start,w*7);
    const s=el("div");s.style.cssText="width:15px;flex:none";
    if(d.getMonth()!==lastM){s.textContent=MONTHS[d.getMonth()].slice(0,3);lastM=d.getMonth()}
    mons.appendChild(s);
  }
  wr.appendChild(mons);
  const hm=el("div","hm");
  const t=iso(today());
  for(let w=0;w<WEEKS;w++){
    for(let r=0;r<7;r++){
      const dt=addDays(start,w*7+r),d=iso(dt);
      const cell=el("div","hmc");
      if(d>t)cell.classList.add("fut");
      const applic=applies(h,d)&&!(h.since&&d<h.since);
      if(applic){
        const p=Math.round(score(h,d)*100);
        const L=lvl(d>t?-1:p);
        if(L>0)cell.classList.add("l"+L);
        cell.title=dt.getDate()+" "+MONTHS[dt.getMonth()]+": "+(h.type==="hours"?fmtH(val(h,d)):(done(h,d)?"hecho":"no hecho"));
      }else{
        cell.style.opacity=".35";
        cell.title=dt.getDate()+" "+MONTHS[dt.getMonth()]+": no aplica";
      }
      hm.appendChild(cell);
    }
  }
  wr.appendChild(hm);
  sc.appendChild(wr);
  setTimeout(()=>{sc.scrollLeft=sc.scrollWidth},30);
  return sc;
}
function move(h,dir){
  const arr=state.habits,i=arr.indexOf(h),j=i+dir;
  if(j<0||j>=arr.length) return;
  arr.splice(j,0,arr.splice(i,1)[0]);touch();render();
}
function addHabit(name,color,days,target){
  const t=target!=null?target:detectTarget(name);
  state.habits.push({
    id:"h"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    name,color,days:days||[0,1,2,3,4,5,6],
    type:t?"hours":"check",target:t||null,
    since:iso(today())
  });
  touch();
}

<script>
/* ============================ modales ============================ */
const wrap=document.getElementById("wrap"),modal=document.getElementById("modal");
let _scrollLockY=0;

function openHabit(h){
  const isNew=!h;
  const draft=h?Object.assign({},h):{name:"",color:COLORS[state.habits.length%COLORS.length],days:[0,1,2,3,4,5,6],type:"check",target:null,objectiveId:""};
  openModal(m=>{

    const hint=el("div","sub");hint.style.margin="-6px 0 12px";
    m.appendChild(hint);

    const l2=el("label","f");l2.textContent="Meta de horas por día (opcional)";

    num.value=draft.target||"";

    function refreshHint(){
      const t=detectTarget(inp.value);

      hint.textContent=num.value&&parseFloat(num.value)>0
        ? "Se suma tiempo: meta de "+fmtH(parseFloat(num.value))+" por día, y las horas se acumulan en Stats."
        : "Hábito de tildar: se marca como hecho o no hecho.";
    }
    inp.addEventListener("input",refreshHint);
    num.addEventListener("input",refreshHint);
    refreshHint();

    const l3=el("label","f");l3.textContent="Color";
    const sws=el("div","swatches");
    COLORS.forEach(c=>{
      const b=el("button","sw"+(c===draft.color?" on":""));b.style.background=c;
      b.onclick=()=>{draft.color=c;sws.querySelectorAll(".sw").forEach(x=>x.classList.remove("on"));b.classList.add("on")};
      sws.appendChild(b);
    });
    l3.appendChild(sws);m.appendChild(l3);

    const l4=el("label","f");l4.textContent="Días en que cuenta";
    const dp=el("div","dayspick");
    DAYN.forEach((d,i)=>{
      const b=el("button","",d);
      if(draft.days.includes(i))b.classList.add("on");
      b.onclick=()=>{
        if(draft.days.includes(i)){if(draft.days.length>1)draft.days=draft.days.filter(x=>x!==i)}
        else draft.days=[...draft.days,i].sort();
        b.classList.toggle("on",draft.days.includes(i));
      };
      dp.appendChild(b);
    });
    l4.appendChild(dp);m.appendChild(l4);

    const l5=el("label","f");l5.textContent="Objetivo al que pertenece (opcional)";
    const gsel=el("select");
    const o0=el("option","","Sin objetivo");o0.value="";gsel.appendChild(o0);
    // los objetivos manuales no dependen de hábitos, así que no se ofrecen acá
    const linkable=objectivesOf().filter(o=>!o.archived&&o.mode!=="manual");
    const existingObjective=objectiveById(draft.objectiveId);
    if(existingObjective&&goalById(existingObjective.goalId)?.archived){
      const old=el("option","",existingObjective.name+" · meta archivada (conservar vínculo)");old.value=existingObjective.id;old.selected=true;gsel.appendChild(old);
    }
    linkable.forEach(o=>{
      const gg=o.goalId?goalById(o.goalId):null;
      const op=el("option","",gg?(gg.name+" · "+o.name):o.name);op.value=o.id;
      if(draft.objectiveId===o.id)op.selected=true;
      gsel.appendChild(op);
    });
    l5.appendChild(gsel);m.appendChild(l5);
    if(!linkable.length){
      const gh=el("div","sub");gh.style.margin="-6px 0 12px";
      gh.textContent="Todavía no creaste objetivos con hábitos. Podés hacerlo desde la pestaña Metas.";
      m.appendChild(gh);
    }

    // período de cumplimiento diario dentro del objetivo elegido
    const winBox=el("div","winbox");
    winBox.appendChild(el("div","wt","📅 Período de cumplimiento diario (opcional)"));
    const wr=el("div","wr");
    const lf=el("label","","Desde"),lt=el("label","","Hasta");
    const fi=dateInput(hasWin(draft)?draft.objFrom:""),ti=dateInput(hasWin(draft)?draft.objTo:"");
    lf.appendChild(fi);lt.appendChild(ti);wr.append(lf,lt);winBox.appendChild(wr);
    const wh=el("div","wh","");winBox.appendChild(wh);
    m.appendChild(winBox);
    function syncWin(){
      const ob=gsel.value?objectiveById(gsel.value):null;
      winBox.style.display=ob?"block":"none";
      if(ob) wh.textContent=ob.mode==="auto"
        ? "Para dejar el objetivo al 100% hay que cumplir este hábito todos los días entre estas fechas. Vacío = se mide desde que empezó."

function sanitizeNavArr(arr,fallback,size){
  if(!Array.isArray(arr))return fallback.slice();
  const seen=new Set();
  const out=arr.filter(k=>NAV_META[k]&&!seen.has(k)&&seen.add(k));
  if(out.length!==size)return fallback.slice();
  return out;
}
function ensureNavSettings(){
  state.settings.navMain=sanitizeNavArr(state.settings.navMain,NAV_DEFAULT_MAIN,6);
  state.settings.navMore=sanitizeNavArr(state.settings.navMore,NAV_DEFAULT_MORE,5);
}

/* ---- deslizamiento entre secciones (swipe) ---- */
const SWIPE_MS=230;
let swTouchX=0,swTouchY=0,swTouchScrollY=0,swiping=false,swipeLocked=false,swAnimating=false;

function modalOpen(){const w=document.getElementById("wrap");return w&&!w.classList.contains("hide")}

function goTab(newTab,dirHint){
  if(newTab===tab){window.scrollTo(0,0);return}
  const order=navMain();
  const iOld=order.indexOf(tab),iNew=order.indexOf(newTab);
  if(swAnimating||iOld===-1||iNew===-1){tab=newTab;window.scrollTo(0,0);render();return}
  slideToTab(newTab,dirHint||(iNew>iOld?"left":"right"));
}

function slideToTab(newTab,dir){
  swAnimating=true;
  const outX=dir==="left"?"-32px":"32px";
  view.style.transition="transform "+SWIPE_MS+"ms cubic-bezier(.22,.9,.32,1), opacity "+SWIPE_MS+"ms ease";
  view.style.transform="translateX("+outX+")";
  view.style.opacity="0";
  setTimeout(()=>{
    tab=newTab;
    window.scrollTo(0,0);
    render();
    view.style.transition="none";
    view.style.transform="translateX("+(dir==="left"?"32px":"-32px")+")";
    view.style.opacity="0";
    void view.offsetWidth;
    view.style.transition="transform "+SWIPE_MS+"ms cubic-bezier(.22,.9,.32,1), opacity "+SWIPE_MS+"ms ease";
    view.style.transform="translateX(0)";
    view.style.opacity="1";
    setTimeout(()=>{
      view.style.transition="";view.style.transform="";view.style.opacity="";
      swAnimating=false;
    },SWIPE_MS+30);
  },SWIPE_MS);
}

function snapBack(){
  view.style.transition="transform "+SWIPE_MS+"ms cubic-bezier(.22,.9,.32,1)";
  view.style.transform="translateX(0)";
  setTimeout(()=>{view.style.transition="";view.style.transform=""},SWIPE_MS+30);
}

view.addEventListener("touchstart",e=>{
  if(modalOpen()||swAnimating||e.touches.length!==1){swipeLocked=true;return}
  const t=e.touches[0];
  swTouchX=t.clientX;swTouchY=t.clientY;
  swTouchScrollY=window.scrollY||document.documentElement.scrollTop||0;
  swipeLocked=!!e.target.closest(".scroller, input, textarea, select");
},{passive:true});

/* El swipe se decide recién al soltar el dedo, comparando el punto de inicio y el final.
   Así nunca se llama preventDefault durante el touchmove y el scroll vertical nativo
   queda completamente libre en todo momento, sin importar cómo se mueva el dedo. */
view.addEventListener("touchend",e=>{
  if(swipeLocked||modalOpen()||swAnimating||Math.abs((window.scrollY||document.documentElement.scrollTop||0)-swTouchScrollY)>4)return;
  const t=e.changedTouches[0];
  const dx=t.clientX-swTouchX,dy=t.clientY-swTouchY;
  const threshold=Math.min(90,view.clientWidth*.2);
  if(Math.abs(dx)<threshold||Math.abs(dx)<Math.abs(dy)*1.5)return;
  const order=navMain();
  const idx=order.indexOf(tab);
  if(idx===-1)return;
  if(dx<0&&idx<order.length-1) slideToTab(order[idx+1],"left");
  else if(dx>0&&idx>0) slideToTab(order[idx-1],"right");
},{passive:true});

document.getElementById("cfg").onclick=openCfg;
document.getElementById("desktopToday").onclick=()=>{cursor=today();tab="hoy";render();window.scrollTo(0,0)};
document.getElementById("desktopBackup").onclick=()=>exportBackupFile();
// Las grillas se desplazan horizontalmente, pero la rueda vertical sigue recorriendo la página.
view.addEventListener("wheel",e=>{
  if(!e.target.closest(".scroller")||!e.deltaY||Math.abs(e.deltaX)>Math.abs(e.deltaY)||e.ctrlKey||modalOpen())return;
  const factor=e.deltaMode===1?16:e.deltaMode===2?window.innerHeight:1;
  window.scrollBy({top:e.deltaY*factor,behavior:"instant"});
  e.preventDefault();
},{passive:false});
document.getElementById("prev").onclick=()=>{shift(-1)};

function shift(n){
  if(tab==="hoy")cursor=addDays(cursor,n);
  else if(tab==="semana"||tab==="trabajo")cursor=addDays(cursor,7*n);
  else cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);
  render();
}

function unstickScroll(){
  // si el body quedó "fixed" (modal-lock) pero no hay ningún modal abierto, se libera el scroll
  if(document.body.classList.contains("modal-lock")&&!modalOpen()) unlockScroll();
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)unstickScroll()});
window.addEventListener("pageshow",unstickScroll);
