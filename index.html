function migrate(){
  let ch=false;
  ensureNavSettings();
  if(!Array.isArray(state.goals)){state.goals=[];ch=true}
  if(!Array.isArray(state.objectives)){state.objectives=[];ch=true}
  if(!Array.isArray(state.events)){state.events=[];ch=true}
  if(!Array.isArray(state.notes)){state.notes=[];ch=true}
  if(!Array.isArray(state.boards)){state.boards=[];ch=true}else state.boards.forEach(ensureBoardShape);
  if(!state.work||typeof state.work!=="object"){state.work={};ch=true}

  // -------- metas del sistema viejo (medían directo, con mode/target y
  // hábitos colgados directo vía habit.goalId) -> se envuelven en un
  // objetivo nuevo, y la meta pasa a ser solo nombre + descripción + fecha */
  state.goals.forEach(g=>{
    if(typeof g.desc!=="string"){g.desc="";ch=true}
    if(!g.startDate&&validGoalDate(g.since)){g.startDate=g.since;ch=true}
    const directHabits=state.habits.filter(h=>h.goalId===g.id);
    const hadMode=typeof g.mode==="string";
    if(hadMode||directHabits.length){
      const obj={
        id:"o"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
        goalId:g.id,
        name:g.name,
        mode:g.mode==="hours"?"sum":(g.mode==="days"?"days":"auto"),
        target:g.target||null,
        unit:g.mode==="hours"?"horas":"",
        deadline:g.deadline||null,
        since:g.since||iso(today()),
        color:g.color,
        archived:false
      };
      state.objectives.push(obj);
      directHabits.forEach(h=>{h.objectiveId=obj.id;delete h.goalId});
      delete g.mode;delete g.target;delete g.since;
      ch=true;
    }
  });

  // un hábito no puede apuntar a una meta u objetivo borrados
  state.habits.forEach(h=>{
    if(h.goalId&&!goalById(h.goalId)){delete h.goalId;ch=true}
    if(h.objectiveId&&!objectiveById(h.objectiveId)){delete h.objectiveId;ch=true}
    // el período de cumplimiento solo tiene sentido dentro de un objetivo y con ambas fechas
    if((h.objFrom||h.objTo)&&(!h.objectiveId||!hasWin(h))){delete h.objFrom;delete h.objTo;ch=true}
  });
  // hábito con forma incompleta (backup viejo, importación a medio hacer,
  // dato corrupto): completamos lo mínimo para que la app nunca se rompa
  state.habits.forEach(h=>{
    if(!Array.isArray(h.days)||!h.days.length){h.days=[0,1,2,3,4,5,6];ch=true}
    if(h.type!=="hours"&&h.type!=="check"){h.type=h.target?"hours":"check";ch=true}
    if(typeof h.name!=="string"||!h.name.trim()){h.name="Hábito sin nombre";ch=true}
    if(typeof h.color!=="string"||!h.color){h.color=COLORS[state.habits.indexOf(h)%COLORS.length];ch=true}
    if(!h.id){h.id="h"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);ch=true}
    if(!h.since){h.since=iso(today());ch=true}
  });
  // un objetivo no puede apuntar a una meta borrada (queda "suelto", no se borra su info)
  state.objectives.forEach(o=>{
    if(o.goalId&&!goalById(o.goalId)){o.goalId=null;ch=true}
    if(typeof o.mode!=="string"){o.mode="auto";ch=true}
    if(typeof o.unit!=="string"){o.unit="";ch=true}
    if(!o.since){o.since=iso(today());ch=true}
    if(o.mode==="manual"&&typeof o.completed!=="boolean"){o.completed=false;ch=true}
  });
  state.habits.forEach(h=>{
    for(const k in state.log){
      if(!k.startsWith(h.id+"|")) continue;
      const d=k.split("|")[1];
      if(h.since && d<h.since){h.since=d;ch=true}
    }
  });
  if(migrateGoalArchives())ch=true;
  if(ch) persist();
}
// aplica un objeto de estado ya parseado (backup, importación, restauración,
// o el propio localStorage) rellenando cualquier campo faltante con lo
// necesario para que la app nunca se rompa por un archivo viejo o incompleto
function applyState(s){
  state=Object.assign(state,s);
  state.habits=Array.isArray(s.habits)?s.habits:[];
  state.goals=Array.isArray(s.goals)?s.goals:[];
  state.objectives=Array.isArray(s.objectives)?s.objectives:[];
  state.events=Array.isArray(s.events)?s.events:[];
  state.notes=Array.isArray(s.notes)?s.notes:[];
  state.boards=Array.isArray(s.boards)?s.boards:[];state.boards.forEach(ensureBoardShape);
  state.work=(s.work&&typeof s.work==="object")?s.work:{};
  state.log=(s.log&&typeof s.log==="object")?s.log:{};
  state.settings=Object.assign({labelsRight:true,mascot:"totodile",barSkin:"none",theme:"dark",bgImage:null,bgBrightness:100,bgBlur:0},s.settings||{});
}
function safeParseState(raw){
  if(!raw) return null;
  try{
    const s=JSON.parse(raw);
    if(s&&typeof s==="object"&&Array.isArray(s.habits)) return s;
  }catch(e){}
  return null;
}
/* ------------ backup manual: exportar / importar archivo JSON ------------
   Exportar vuelca TODO el estado (hábitos, metas, objetivos, historial de
   log, eventos, notas, trabajo y configuración) en un .json descargable.
   Importar valida el archivo antes de tocar nada: si no es un backup válido
   o está corrupto, se avisa y la app sigue funcionando con los datos que
   ya tenía, sin romper nada. */
function pad2(n){return String(n).padStart(2,"0")}
function exportBackupFile(){
  try{
    const data=JSON.stringify(state,null,2);
    const d=new Date();
    const fn="agenik-backup-"+d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+".json";
    if(window.AndroidBridge&&typeof AndroidBridge.saveBackup==="function"){
      AndroidBridge.saveBackup(fn,data);
      return;
    }
    const blob=new Blob([data],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=el("a");
    a.href=url;
    a.download=fn;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast("Backup exportado");
  }catch(e){toast("No se pudo exportar el backup")}
}
function importBackupText(raw){
  const s=safeParseState(raw);
  if(!s){toast("El archivo no es un backup válido de AGENIK. No se modificó nada.");return false}
  // guardamos lo que había antes como copia automática, por si el
  // archivo importado no era lo que se esperaba y hay que volver atrás
  try{localStorage.setItem(KEY+"_auto",JSON.stringify(state))}catch(e){}
  applyState(s);migrate();
  touch();closeModal();buildNav();render();applyMascot();applyTheme();applyBg();applyBarSkin();
  toast("Datos importados correctamente");
  return true;
}
function importBackupFile(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>importBackupText(reader.result);
  reader.onerror=()=>toast("No se pudo leer el archivo. No se modificó nada.");
  try{ reader.readAsText(file); }catch(e){ toast("No se pudo leer el archivo. No se modificó nada."); }
}
function decodeBackupBase64(b64){
  const bin=atob(String(b64||"")),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
window.__agenikBackupSaved=(ok,msg)=>{

  else if(msg&&msg!=="cancelled")toast(msg||"No se pudo exportar el backup");

window.__agenikBackupImported=(b64)=>{

// carga desde localStorage. Si el dato principal está dañado (por ejemplo,
// la app se cerró a mitad de una escritura), cae a la última copia de
// seguridad automática que guarda persist() antes de cada guardado nuevo.
function loadLocal(){
  const primary=safeParseState(localStorage.getItem(KEY));
  if(primary){ applyState(primary); return; }
  const backup=safeParseState(localStorage.getItem(KEY+"_auto"));
  if(backup){
    applyState(backup);
    try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
    setTimeout(()=>toast("Se recuperaron tus datos de una copia de seguridad automática"),500);
  }
}
async function initDb(){
  let c=null;
  for(let i=0;i<50;i++){ if(window.claude&&window.claude.use){c=window.claude;break} await new Promise(r=>setTimeout(r,200)); }
  if(!c) return;
  let db=null;
  try{ db=await c.use("db") }catch(e){}
  if(!db) return;
  dbDoc=db.doc("app/estado");
  try{
    const snap=await dbDoc.get();
    if(snap.exists){
      const d=snap.data();
      const remote=JSON.parse(d.json||"{}");
      if((remote.updatedAt||0)>(state.updatedAt||0)&&Array.isArray(remote.habits)){ applyState(remote); migrate(); buildNav(); render(); applyMascot(); applyTheme(); applyBg(); applyBarSkin(); }
      else if((state.updatedAt||0)>(remote.updatedAt||0)) pushDb();
    }else if(state.habits.length) pushDb();
  }catch(e){}
  try{
    dbDoc.onSnapshot(s=>{
      if(!s.exists) return;
      try{
        const remote=JSON.parse(s.data().json||"{}");
        if((remote.updatedAt||0)>(state.updatedAt||0)&&Array.isArray(remote.habits)){
          applyState(remote);migrate();
          try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
          buildNav();render();applyMascot();applyTheme();applyBg();applyBarSkin();
        }
      }catch(e){}
    },()=>{});
  }catch(e){}
}

/* ============================ interacción con celdas ============================ */
function setVal(h,d,v){
  if(v>0 && h.since && d<h.since) h.since=d;   // si completás para atrás, el hábito arranca ahí
  const k=key(h.id,d);
  if(!v) delete state.log[k]; else state.log[k]=Math.round(v*100)/100;
  touch();
}
function toggle(h,d){
  if(h.type==="hours"){ setVal(h,d, done(h,d)?0:(h.target||1)); }
  else setVal(h,d, val(h,d)?0:1);
}

let pressTimer=null,longFired=false;
function bindCell(el,h,d){
  let sx=0,sy=0,moved=false;
  el.addEventListener("pointerdown",e=>{
    longFired=false;moved=false;sx=e.clientX;sy=e.clientY;
    pressTimer=setTimeout(()=>{longFired=true;if(navigator.vibrate)navigator.vibrate(12);openHours(h,d)},420);
  });
  el.addEventListener("pointermove",e=>{
    if(Math.abs(e.clientX-sx)>9||Math.abs(e.clientY-sy)>9){moved=true;clearTimeout(pressTimer)}
  });
  const clear=()=>clearTimeout(pressTimer);
  el.addEventListener("pointerup",e=>{clear();if(!longFired&&!moved){toggle(h,d);render()}});
  el.addEventListener("pointerleave",clear);
  el.addEventListener("pointercancel",clear);
  el.addEventListener("contextmenu",e=>e.preventDefault());
}
function paintBox(el,h,d){
  const s=score(h,d),v=val(h,d);
  el.innerHTML="";el.style.borderColor="";el.style.background="";
  if(s>0){
    const f=document.createElement("span");f.className="fill";
    f.style.background=h.color;f.style.height=(s*100)+"%";el.appendChild(f);
    el.style.borderColor=h.color;
    if(s>=.999){const c=document.createElement("span");c.className="ch";c.textContent="✓";el.appendChild(c)}
  }
  if(isFuture(d)) el.classList.add("fut");
  el.title=h.type==="hours"?fmtH(v):(v?"hecho":"");
}

  {id:"dark",name:"Oscuro",desc:"azulado noche",a:"#171F24",b:"#0F1519"},
  {id:"vintage",name:"Vintage",desc:"marrón con detalles claros",a:"#3C2D1C",b:"#F1E4CB"},
  {id:"black",name:"Negro",desc:"grises suaves",a:"#1C1C1C",b:"#141414"},
  {id:"batman",name:"Batman",desc:"negro con detalles murciélago",a:"#0A0A0C",b:"#F2C230"},
  {id:"spiderman",name:"Spiderman",desc:"rojo y azul arácnido",a:"#C8102E",b:"#10173A"},
  {id:"custom",name:"Personalizado",desc:"elegí tus propios colores",a:"#171F24",b:"#5FC28C"}
];
const THEME_BANNERS={
  batman:"🦇  ".repeat(40),
  spiderman:"🕸️ 🕷️ ".repeat(30)
};
const CUSTOM_THEME_DEFAULTS={
  bg:"#0F1519",panel:"#171F24",panel2:"#1D262C",
  ink:"#E6EDEF",ink2:"#93A5AF",line:"#2C383F",ok:"#5FC28C"
};
const CUSTOM_VARS=["--bg","--panel","--panel-2","--ink","--ink-2","--ink-3","--line","--line-soft","--ok"];
function applyTheme(){
  const t=(state.settings&&state.settings.theme)||"dark";
  document.documentElement.setAttribute("data-theme",t);
  const rs=document.documentElement.style;
  if(t==="custom"){
    const c=Object.assign({},CUSTOM_THEME_DEFAULTS,state.settings.customTheme||{});
    rs.setProperty("--bg",c.bg);
    rs.setProperty("--panel",c.panel);
    rs.setProperty("--panel-2",c.panel2);
    rs.setProperty("--ink",c.ink);
    rs.setProperty("--ink-2",c.ink2);
    rs.setProperty("--ink-3",c.ink2);
    rs.setProperty("--line",c.line);
    rs.setProperty("--line-soft",c.line);
    rs.setProperty("--ok",c.ok);
  }else{
    CUSTOM_VARS.forEach(v=>rs.removeProperty(v));
  }
  const banner=document.getElementById("themeBanner");
  if(banner) banner.textContent=THEME_BANNERS[t]||"";
}
function applyBg(){
  const layer=document.getElementById("bgLayer");
  if(!layer)return;
  const src=state.settings&&state.settings.bgImage;
  if(src){
    layer.style.backgroundImage="url("+src+")";
    const br=state.settings.bgBrightness||100;
    const bl=state.settings.bgBlur||0;
    layer.style.filter="brightness("+br+"%) blur("+bl+"px)";
    document.body.classList.add("has-bg");
  }else{
    layer.style.backgroundImage="";
    layer.style.filter="";
    document.body.classList.remove("has-bg");
  }
}

function applyBarSkin(){
  const box=document.getElementById("barSkin");
  const id=state.settings&&state.settings.barSkin;
  const sk=(id&&id!=="none")?BAR_SKINS[id]:null;
  document.body.classList.toggle("barskin",!!sk);
  if(!box)return;
  if(!sk){box.style.backgroundImage="";box.style.height="";return}
  box.style.backgroundImage='url("data:image/png;base64,'+sk.b64+'"),linear-gradient('+sk.fill+','+sk.fill+')';
  placeSkin();
}
function placeSkin(){
  const box=document.getElementById("barSkin"),nav=document.getElementById("tabs");
  const id=state.settings&&state.settings.barSkin;
  const sk=(id&&id!=="none")?BAR_SKINS[id]:null;
  if(!box||!nav)return;
  if(!sk){document.body.style.paddingBottom="";return}
  const H=nav.offsetHeight+sk.above;
  document.body.style.paddingBottom=(H+24)+"px"; // que lo último de la pantalla quede por encima del paisaje
  box.style.height=H+"px";
  box.style.backgroundSize="auto,100% "+Math.max(0,H-sk.h)+"px";
}

function petFacesRight(m){
  const flip=!!(state.settings.petFlip&&state.settings.petFlip[m.id]);
  return (m.facing==="right")!==flip;
}
function applyMascot(){
  const lane=document.getElementById("totoLane");
  if(!lane)return;
  const id=state.settings.mascot;
  const m=id&&id!=="none"?MASCOTS[id]:null;
  if(!m){lane.classList.add("off");return}
  lane.classList.remove("off");
  const walker=lane.querySelector(".toto-walker");
  const sprite=lane.querySelector(".toto-sprite");
  walker.classList.remove("face-left","face-right");
  walker.classList.add(petFacesRight(m)?"face-right":"face-left");
  walker.style.animation="none";void walker.offsetWidth;walker.style.animation=""; // reinicia el recorrido desde el principio
  const scale=MASCOT_H/m.frameH;
  const W=Math.round(m.frameW*scale),H=Math.round(m.frameH*scale),total=W*m.frames;
  sprite.style.width=W+"px";sprite.style.height=H+"px";
  sprite.style.backgroundImage="url(data:image/png;base64,"+m.b64+")";
  sprite.style.backgroundSize=total+"px "+H+"px";
  sprite.style.animation="totoFrames"+m.id+" "+(m.fps||.8)+"s steps("+m.frames+") infinite";
  let styleEl=document.getElementById("totoDynStyle");
  if(!styleEl){styleEl=document.createElement("style");styleEl.id="totoDynStyle";document.head.appendChild(styleEl)}
  styleEl.textContent="@keyframes totoFrames"+m.id+"{from{background-position-x:0}to{background-position-x:-"+total+"px}}";
}

/* ---------------- MASCOTAS (vista) ---------------- */
let petSub="mascota";
function viewMascotas(){
  const seg=el("div","seg");
  [["mascota","🐾 Mascota"],["skin","🌿 Skin de barra"]].forEach(([k,t])=>{
    const b=el("button",petSub===k?"on":"",t);
    b.onclick=()=>{petSub=k;render()};
    seg.appendChild(b);
  });
  view.appendChild(seg);
  if(petSub==="skin"){viewBarSkins();return}
  const c=el("div","card");
  c.appendChild(el("h2","","Mascota"));
  c.appendChild(el("div","sub","elegí quién te acompaña caminando arriba de la barra, o apagalo"));

  const g=el("div","petgrid");
  const cur=state.settings.mascot||"none";

  const noneOpt=el("div","petopt"+(cur==="none"?" on":""));
  const npv=el("div","petprev none","🚫");
  const ni=el("div","petinfo");ni.appendChild(el("b","","Sin mascota"));ni.appendChild(el("span","","la barra queda libre"));
  const nck=el("div","petck",cur==="none"?"✓":"");
  noneOpt.append(npv,ni,nck);
  noneOpt.onclick=()=>{state.settings.mascot="none";touch();applyMascot();render()};
  g.appendChild(noneOpt);

  Object.values(MASCOTS).forEach(m=>{
    const opt=el("div","petopt"+(cur===m.id?" on":""));
    const pv=el("div","petprev");
    const i=el("i");
    const scale=MASCOT_H/m.frameH;
    const W=Math.round(m.frameW*scale),H=Math.round(m.frameH*scale);
    const fit=Math.min(1,40/Math.max(W,H));
    i.style.cssText="width:"+W+"px;height:"+H+"px;transform:scale("+fit+")"+
      (petFacesRight(m)?"":" scaleX(-1)")+
      ";background:url(data:image/png;base64,"+m.b64+") no-repeat;background-size:"+(W*m.frames)+"px "+H+"px";
    pv.appendChild(i);
    const inf=el("div","petinfo");inf.appendChild(el("b","",m.name));inf.appendChild(el("span","",m.desc||""));
    const ck=el("div","petck",cur===m.id?"✓":"");
    opt.append(pv,inf,ck);
    opt.onclick=()=>{state.settings.mascot=m.id;touch();applyMascot();render()};
    g.appendChild(opt);
  });
  c.appendChild(g);

  const curM=MASCOTS[cur];
  if(curM){
    const fr=el("div","petopt");
    const fi=el("div","petinfo");
    fi.appendChild(el("b","","Invertir sentido"));
    fi.appendChild(el("span","","si "+curM.name+" mira hacia el lado contrario al que camina, activalo"));
    const on=!!(state.settings.petFlip&&state.settings.petFlip[curM.id]);
    const sw=el("button","mini",on?"✓":"");
    fr.append(fi,sw);
    fr.style.marginTop="9px";
    sw.onclick=()=>{
      if(!state.settings.petFlip)state.settings.petFlip={};
      state.settings.petFlip[curM.id]=!state.settings.petFlip[curM.id];
      touch();applyMascot();render();
    };
    c.appendChild(fr);
  }

  const soon=el("div","petsoon","✨ Vas a poder sumar más mascotas más adelante.");
  soon.style.marginTop="10px";c.appendChild(soon);
  view.appendChild(c);
}

/* ---------------- SKIN DE BARRA (vista) ---------------- */
function viewBarSkins(){
  const c=el("div","card");
  c.appendChild(el("h2","","Skin de barra"));
  c.appendChild(el("div","sub","elegí el fondo de la barra de accesos, por donde caminan las mascotas"));
  const g=el("div","petgrid");
  const cur=state.settings.barSkin||"none";
  const pick=id=>{state.settings.barSkin=id;touch();applyBarSkin();placeToto();render()};

  const noneOpt=el("div","petopt"+(cur==="none"?" on":""));
  const npv=el("div","petprev none","🚫");
  const ni=el("div","petinfo");ni.appendChild(el("b","","Sin skin"));ni.appendChild(el("span","","la barra normal de siempre"));
  noneOpt.append(npv,ni,el("div","petck",cur==="none"?"✓":""));
  noneOpt.onclick=()=>pick("none");
  g.appendChild(noneOpt);

  Object.values(BAR_SKINS).forEach(sk=>{
    const opt=el("div","petopt"+(cur===sk.id?" on":""));
    const pv=el("div","petprev skinprev");
    const i=el("i");
    const k=56/sk.prev.s;
    i.style.cssText="background:url(data:image/png;base64,"+sk.b64+") no-repeat;"+
      "background-size:"+(sk.w*k)+"px "+(sk.h*k)+"px;"+
      "background-position:"+(-sk.prev.x*k)+"px "+(-sk.prev.y*k)+"px";
    pv.appendChild(i);
    const inf=el("div","petinfo");inf.appendChild(el("b","",sk.name));inf.appendChild(el("span","",sk.desc||""));
    opt.append(pv,inf,el("div","petck",cur===sk.id?"✓":""));
    opt.onclick=()=>pick(sk.id);
    g.appendChild(opt);
  });
  c.appendChild(g);
  view.appendChild(c);
}

const view=document.getElementById("view");
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};

/* inputs de fecha/hora con teclado numérico (sin selector nativo tipo reloj/calendario) */
const _nativeVal=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,"value");
function dateInput(initial){
  const e=document.createElement("input");
  e.type="text";e.inputMode="numeric";e.autocomplete="off";e.placeholder="DD/MM/AAAA";e.maxLength=10;
  e.className="fld-date";
  let val="";
  const paint=v=>{const s=v?v.split("-"):null;_nativeVal.set.call(e,s?s[2]+"/"+s[1]+"/"+s[0]:"")};
  Object.defineProperty(e,"value",{configurable:true,
    get(){return val},
    set(v){val=v||"";paint(val)}
  });
  e.addEventListener("input",()=>{
    let raw=_nativeVal.get.call(e).replace(/\D/g,"").slice(0,8);
    let out=raw;
    if(raw.length>4)out=raw.slice(0,2)+"/"+raw.slice(2,4)+"/"+raw.slice(4);
    else if(raw.length>2)out=raw.slice(0,2)+"/"+raw.slice(2);
    _nativeVal.set.call(e,out);
    val=raw.length===8?(raw.slice(4,8)+"-"+raw.slice(2,4)+"-"+raw.slice(0,2)):"";
  });
  e.value=initial||"";
  return e;
}
function timeInput(initial){
  const e=document.createElement("input");
  e.type="text";e.inputMode="numeric";e.autocomplete="off";e.placeholder="HH:MM";e.maxLength=5;
  e.className="fld-time";
  let val="";
  Object.defineProperty(e,"value",{configurable:true,
    get(){return val},
    set(v){val=v||"";_nativeVal.set.call(e,val)}
  });
  e.addEventListener("input",()=>{
    let raw=_nativeVal.get.call(e).replace(/\D/g,"").slice(0,4);
    let out=raw;
    if(raw.length>2)out=raw.slice(0,2)+":"+raw.slice(2);
    _nativeVal.set.call(e,out);
    val=raw.length===4?(raw.slice(0,2)+":"+raw.slice(2,4)):"";
  });
  e.value=initial||"";
  return e;
}

function render(){
  try{
    if(chartResizeObserver)chartResizeObserver.disconnect();
    chartBoxes.clear();
    if(chartResizeObserver)chartResizeObserver.disconnect();
    chartBoxes.clear();
    document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.id==="more"?navMore().includes(tab):b.dataset.tab===tab));
    document.getElementById("nav").style.display=(tab==="stats"||tab==="habitos"||tab==="metas"||tab==="notas"||tab==="mascotas"||tab==="boards"||(tab==="cal"&&calMode==="act"))?"none":"flex";
    view.innerHTML="";
    if(tab==="hoy") viewHoy();
    else if(tab==="semana") viewSemana();
    else if(tab==="mes") viewMes();
    else if(tab==="cal") viewCal();
    else if(tab==="trabajo") viewTrabajo();
    else if(tab==="notas") viewNotas();
    else if(tab==="mascotas") viewMascotas();
    else if(tab==="metas") viewMetas();
    else if(tab==="stats") viewStats();
    else if(tab==="boards") viewBoards();
    else viewHabitos();
    unstickScroll();
    placeToto();
    header();
    chartBoxes.forEach(box=>{
      if(!box.isConnected)return;
      if(chartResizeObserver)chartResizeObserver.observe(box);
      else requestAnimationFrame(()=>box.__paintChart(Math.round(box.clientWidth)));
    });
  }catch(err){
    // pantalla de emergencia: nunca dejar al usuario con una app en blanco.
    // los datos en localStorage no se tocan, así que reintentar o volver a
    // "Hoy" suele resolverlo sin perder nada.
    try{console.error("Error de render:",err)}catch(e){}
    view.innerHTML="";
    const box=el("div","card");
    box.appendChild(el("h2","","Uy, algo no cargó bien"));
    box.appendChild(el("div","sub","Tus datos están a salvo y guardados. Probá de nuevo o volvé a Hoy."));
    const row=el("div","row2");row.style.marginTop="10px";
    const b1=el("button","btn sec","Reintentar");b1.onclick=()=>render();
    const b2=el("button","btn pri","Ir a Hoy");b2.onclick=()=>{tab="hoy";render()};
    row.append(b1,b2);box.appendChild(row);
    view.appendChild(box);
  }
}

function weekNum(d){
  const t=new Date(d.getFullYear(),0,1);
  return Math.ceil(((d-t)/86400000+t.getDay()+1)/7);
}

const EVENT_WINDOW=15;   // días hacia adelante en los que un evento aparece en Hoy
function viewHoy(){
  const d=iso(cursor),hs=habitsOf().filter(h=>applies(h,d));
  if(!habitsOf().length) return emptyState();
  const st=rangeStats(hs,[d]);
  const pend=Math.max(0,st.tot-st.fullDays);

  /* 1) PROGRESO DE HOY -------------------------------------------------- */
  const c=el("div","card");
  const hero=el("div","hero");
  const n=el("div","big n");n.innerHTML=st.pct+"<i>%</i>";
  hero.appendChild(n);
  const lbl=el("div");
  lbl.appendChild(el("div","","del día cumplido"));
  lbl.appendChild(el("div","sub",st.tot?(st.fullDays+" de "+st.tot+" hábitos completos"):"nada programado hoy"));
  lbl.style.paddingBottom="8px";
  hero.appendChild(lbl);
  c.appendChild(hero);
  const tr=el("div","track");const fi=el("i");

  tr.appendChild(fi);c.appendChild(tr);
  if(st.tot){
    const ch=el("div","chips");
    ch.appendChild(chip("Hechos","<b>"+st.fullDays+"</b>"));
    ch.appendChild(chip("Te falta","<b>"+pend+"</b>"));
    c.appendChild(ch);
  }
  view.appendChild(c);

  /* 1b) EVENTOS CERCANOS ------------------------------------------------
     lo que tenés en la agenda dentro de los próximos EVENT_WINDOW días */
  const tIso=iso(today()),limIso=iso(addDays(today(),EVENT_WINDOW));
  const near=evsOf().filter(e=>e.date>=tIso&&e.date<=limIso)
    .sort((a,b)=>(a.date+(a.time||"99")).localeCompare(b.date+(b.time||"99")));
  if(near.length){
    const eh=el("div");eh.style.margin="18px 2px 8px";
    eh.appendChild(el("h2","","Próximos eventos"));
    eh.appendChild(el("div","sub","en los próximos "+EVENT_WINDOW+" días"));
    view.appendChild(eh);
    const ec=el("div","card");
    const el2=el("div","evlist");el2.style.marginTop="0";
    near.slice(0,5).forEach(e=>el2.appendChild(evRow(e,true,true)));
    ec.appendChild(el2);
    if(near.length>5){
      const more=el("button","addobj","+ "+(near.length-5)+" más en la agenda");
      more.onclick=()=>{tab="cal";calMode="agenda";window.scrollTo(0,0);render()};
      ec.appendChild(more);
    }
    view.appendChild(ec);
  }

  /* 2) HÁBITOS DE HOY ------------------------------------------------- */
  const listHead=el("div");listHead.style.margin="18px 2px 8px";
  listHead.appendChild(el("h2","","Hábitos de hoy"));
  view.appendChild(listHead);
  const list=el("div","card");
  if(!hs.length){ list.appendChild(el("div","sub","Hoy no hay hábitos programados. Descansá.")); }
  hs.forEach(h=>{
    const it=el("div","today-item");
    const b=el("button","bigbox");paintBox(b,h,d);
    b.onclick=()=>{toggle(h,d);render()};
    it.appendChild(b);
    const nm=el("div","nm");nm.textContent=h.name;
    if(h.type==="hours"){
      const sm=el("small");sm.textContent="meta "+fmtH(h.target)+" · llevás "+fmtH(val(h,d));nm.appendChild(sm);
    }else{
      const r=streak(h);const sm=el("small");sm.textContent=r>1?("racha de "+r+" días"):"marcá cuando lo hagas";nm.appendChild(sm);
    }
    const gid=habitGoalId(h),gg=gid?goalById(gid):null;
    if(gg){
      const tg=el("span","tagmeta");tg.style.marginTop="4px";
      const gd=el("span","dot");gd.style.background=gg.color;
      tg.append(gd,document.createTextNode(gg.name));
      nm.appendChild(tg);
    }
    it.appendChild(nm);
    if(h.type==="hours"){
      const sp=el("div","stepper");
      const minus=el("button","","–");minus.onclick=()=>{setVal(h,d,Math.max(0,val(h,d)-0.25));render()};
      const v=el("div","val",fmtH(val(h,d)));
      const plus=el("button","","+");plus.onclick=()=>{setVal(h,d,val(h,d)+0.25);render()};
      sp.append(minus,v,plus);
      sp.querySelector(".val").onclick=()=>openHours(h,d);
      it.appendChild(sp);
    }
    list.appendChild(it);
  });
  view.appendChild(list);

  /* 3) METAS → OBJETIVOS -------------------------------------------------
     resumen de avance: cada meta con su % y, debajo, sus objetivos
     (los hábitos que la alimentan) con el % propio y si ya se hicieron hoy */
  const gs=goalsOf().filter(g=>goalHabits(g).length||goalObjectives(g).some(o=>o.mode==="manual"));
  if(gs.length){
    gs.sort((a,b)=>{
      const at=goalHabits(a).some(h=>applies(h,d))?0:1;
      const bt=goalHabits(b).some(h=>applies(h,d))?0:1;
      if(at!==bt) return at-bt;
      return goalStats(b).pct-goalStats(a).pct;
    });
    const head=el("div");head.style.margin="18px 2px 8px";
    head.appendChild(el("h2","","Tus metas"));
    head.appendChild(el("div","sub","el avance de cada objetivo empuja su meta"));
    view.appendChild(head);
    gs.forEach(g=>view.appendChild(metaMiniCard(g,d)));
  }

  const w=weekDays(cursor),ws=rangeStats(habitsOf(),w);
  const c2=el("div","card");

  sp.appendChild(donut(ws.pct,"var(--ink)",74));

  tx.appendChild(el("h2","","Esta semana"));
  tx.appendChild(el("div","sub",ws.fullDays+" marcas completas"+(ws.hours?" · "+fmtH(ws.hours)+" acumuladas":"")));
  tx.appendChild(el("div","sub",perfectDays(w)+" días perfectos"));
  sp.appendChild(tx);c2.appendChild(sp);
  view.appendChild(c2);
}

function buildGrid(days,opts){
  const hs=habitsOf();
  const right=state.settings.labelsRight;
  const sheet=el("div","sheet");
  if(opts.caption){
    const mb=el("div","monthbar");
    mb.appendChild(el("b","",opts.caption));
    if(opts.captionSub) mb.appendChild(el("span","",opts.captionSub));
    sheet.appendChild(mb);
  }
  const sc=el("div","scroller");
  const grid=el("div","grid"+(opts.wide?" wide":""));
  const t=iso(today());

  // encabezado de días
  const head=el("div","grow head");
  const hc=el("div","cells");
  days.forEach(d=>{
    const dt=fromIso(d),w=dow(dt);
    const c=el("div","cell dayhead"+(w>4?" wknd":"")+(d===t?" today":""));
    c.appendChild(el("span","",DAYN[w]));
    const b=el("b","",String(dt.getDate()));c.appendChild(b);
    hc.appendChild(c);
  });
  const hl=el("div","lab "+(right?"right":"left"));
  hl.appendChild(el("span","",opts.labelHead||"Hábitos"));
  const hp=el("div","pct","%");
  if(right) head.append(hc,hp,hl); else head.append(hl,hc,hp);
  grid.appendChild(head);

  // filas
  hs.forEach(h=>{
    const row=el("div","grow");
    const cells=el("div","cells");
    days.forEach(d=>{
      const c=el("div","cell");
      const b=el("button","box");
      if(!applies(h,d)){b.classList.add("na");b.disabled=true}
      else{paintBox(b,h,d);bindCell(b,h,d)}
      c.appendChild(b);cells.appendChild(c);
    });
    const st=habitStats(h,days);
    const lab=el("div","lab "+(right?"right":"left"));
    lab.appendChild(el("span","",h.name));
    const meta=el("div","meta");
    const dt=el("span","dot");dt.style.background=h.color;meta.appendChild(dt);
    meta.appendChild(el("span","",h.type==="hours"?fmtH(st.hours)+" / "+fmtH(h.target)+" día":st.full+"/"+st.tot+" días"));
    lab.appendChild(meta);
    lab.onclick=()=>openHabit(h);
    const p=el("div","pct",st.pct+"%");
    p.style.color=st.pct>=80?"var(--ok)":(st.pct<40?"var(--ink-3)":"var(--ink)");
    if(right) row.append(cells,p,lab); else row.append(lab,cells,p);
    grid.appendChild(row);
  });

  // pie: % por día
  if(hs.length){
    const foot=el("div","grow foot");
    const fc=el("div","cells");
    days.forEach(d=>{
      const st=rangeStats(hs,[d]);
      const c=el("div","cell",st.tot?st.pct+"%":"");
      fc.appendChild(c);
    });
    const fl=el("div","lab "+(right?"right":"left"));
    fl.appendChild(el("span","","Día cumplido"));
    const all=rangeStats(hs,days);
    const fp=el("div","pct",all.pct+"%");
    if(right) foot.append(fc,fp,fl); else foot.append(fl,fc,fp);
    grid.appendChild(foot);
  }
  sc.appendChild(grid);sheet.appendChild(sc);
  return sheet;
}

    c.appendChild(el("span","","semana "+(i+1)));
    const a=fromIso(wk[0]).getDate(), b=fromIso(wk[wk.length-1]).getDate();
    c.appendChild(el("b","",a+"–"+b));
    hc.appendChild(c);
  });
  const hl=el("div","lab "+(right?"right":"left"));hl.appendChild(el("span","","Objetivos"));
  const hp=el("div","pct","mes");
  if(right) head.append(hc,hp,hl); else head.append(hl,hc,hp);
  grid.appendChild(head);

  habitsOf().forEach(h=>{
    const row=el("div","grow");const cells=el("div","cells");
    weeks.forEach(wk=>{
      const st=habitStats(h,wk);
      const c=el("div","cell");
      if(st.tot){
        const box=el("div","box");
        const f=el("span","fill");f.style.background=h.color;f.style.height=st.pct+"%";
        box.appendChild(f);box.style.borderColor=h.color;
        if(st.pct>=100){const ck=el("span","ch","✓");box.appendChild(ck)}
        box.title=st.pct+"%";
        c.appendChild(box);
      }else c.textContent="";
      cells.appendChild(c);
    });
    const st=habitStats(h,days);
    const lab=el("div","lab "+(right?"right":"left"));
    lab.appendChild(el("span","",h.name));
    const meta=el("div","meta");const dt=el("span","dot");dt.style.background=h.color;
    meta.append(dt,el("span","",h.type==="hours"?fmtH(st.hours)+" en el mes":st.full+" días"));
    lab.appendChild(meta);
    const p=el("div","pct",st.pct+"%");
    if(right) row.append(cells,p,lab); else row.append(lab,cells,p);
    grid.appendChild(row);
  });
  sc.appendChild(grid);sheet.appendChild(sc);view.appendChild(sheet);

  const st=rangeStats(habitsOf(),days);
  const c=el("div","card");
  c.appendChild(el("h2","","Resumen del mes"));
  const sp=el("div","split");sp.style.marginTop="10px";
  sp.appendChild(donut(st.pct,"var(--ink)",92));
  const lg=el("div","legend");
  habitsOf().forEach(h=>{
    const st2=habitStats(h,days);
    const r=el("div");
    const dt=el("span","dot");dt.style.background=h.color;dt.style.flex="none";
    r.append(dt,el("span","",h.name),el("b","",st2.pct+"%"));
    lg.appendChild(r);
  });
  sp.appendChild(lg);
  c.appendChild(sp);
  const k=el("div","kpis");
  k.appendChild(kpi(st.fullDays,"marcas completas"));
  k.appendChild(kpi(perfectDays(days),"días perfectos"));
  if(st.hours) k.appendChild(kpi(fmtH(st.hours),"horas cargadas"));
  c.appendChild(k);
  view.appendChild(c);
}
function kpi(n,t){const d=el("div","kpi");d.appendChild(el("b","",String(n)));d.appendChild(el("span","",t));return d}

/* ---------------- METAS ---------------- */
function viewMetas(){
  goalArchiveNavigation();
  if(goalsTab==="archived"){viewArchivedGoals();return}
  const gs=goalsOf();
  if(!gs.length){
    const c=el("div","card empty");
    c.appendChild(el("h2","","Todavía no tenés metas"));
    c.appendChild(el("p","","Una meta es el resultado grande —“ponerme en forma”, “terminar el curso”— y los objetivos son los resultados concretos y medibles que la van cumpliendo: “correr 50 km este mes”, por ejemplo. Cada objetivo agrupa uno o varios hábitos —o puede ser manual, sin hábitos, y lo marcás vos como cumplido— y su progreso empuja el de la meta."));
    const b=el("button","btn pri","Crear mi primera meta");b.onclick=()=>openGoal(null);
    c.appendChild(b);
    view.appendChild(c);
    if(!habitsOf().length){
      const t=el("div","sub","Primero creá algún hábito en la pestaña Hábitos para poder sumarlo a un objetivo.");
      t.style.padding="0 2px";view.appendChild(t);
    }
    return;
  }

  gs.forEach(g=>{
    const s=goalStats(g);
    const c=el("div","card");

    const hd=el("div","goalhead");
    hd.appendChild(donut(s.pct,g.color,66));
    const nm=el("div","nm");
    nm.appendChild(el("h2","",g.name));
    nm.appendChild(el("div","sub",s.total?(s.total===1?"1 objetivo":s.total+" objetivos"):"sin objetivos todavía"));
    hd.appendChild(nm);
    const ed=el("button","mini","✎");ed.onclick=()=>openGoal(g);
    hd.appendChild(ed);
    c.appendChild(hd);

    if(g.desc) c.appendChild(el("div","metadesc",g.desc));
    const linkedBoard=boardLinkForGoal(g);if(linkedBoard){const lb=el("button","btn sec board-link-btn","▦ Abrir tablero relacionado · "+linkedBoard.title);lb.onclick=()=>openLinkedBoard(linkedBoard);c.appendChild(lb)}

    const tr=el("div","track");const fi=el("i");
    fi.style.width=s.pct+"%";fi.style.background=g.color;tr.appendChild(fi);
    c.appendChild(tr);

    const tb=el("div","gtab");
    const row=(lab,html,sub)=>{
      const r=el("div","r");
      r.appendChild(el("em","",lab));
      const b=el("b");b.innerHTML=html;
      if(sub){const sm=el("small","",sub);b.appendChild(sm)}
      r.appendChild(b);tb.appendChild(r);
    };

    row("Progreso general", s.pct+"%",
        s.total?(s.doneCount+" de "+s.total+" objetivos cumplidos"):null);

    if(g.deadline){
      const dl=s.daysLeft;
      row("Fecha límite", fmtDate(g.deadline),
          dl>0?("faltan "+dl+" día"+(dl===1?"":"s")):(dl===0?"es hoy":("venció hace "+Math.abs(dl)+" día"+(Math.abs(dl)===1?"":"s"))));
    }else{
      row("Fecha límite","Sin fecha","abierta, sin cuenta regresiva");
    }
    c.appendChild(tb);

    if(s.rows.length){
      const ow=el("div","objwrap");
      s.rows.forEach(({o,st})=>ow.appendChild(objectiveCard(o,st)));
      c.appendChild(ow);
    }else{
      const w=el("div","sub");w.style.marginTop="10px";
      w.textContent="Todavía no tiene objetivos. Agregá uno para que empiece a avanzar.";
      c.appendChild(w);
    }

    const addO=el("button","addobj","+ Nuevo objetivo");
    addO.onclick=()=>openObjective(null,g.id);
    c.appendChild(addO);
    c.appendChild(archiveButton("Archivar meta",()=>requestArchiveGoal(g)));

    view.appendChild(c);
  });

  const add=el("button","btn pri","Nueva meta");add.onclick=()=>openGoal(null);
  view.appendChild(add);

  const loose=objectivesOf().filter(o=>!o.archived&&!o.goalId);
  if(loose.length){
    const c=el("div","card");c.style.marginTop="12px";
    c.appendChild(el("h2","","Objetivos sueltos"));
    c.appendChild(el("div","sub","No pertenecen a ninguna meta. Tocá uno para asignarlo."));
    const ow=el("div","objwrap");
    loose.forEach(o=>ow.appendChild(objectiveCard(o,objectiveStats(o))));
    c.appendChild(ow);view.appendChild(c);
  }

  const looseHabits=habitsOf().filter(h=>!h.objectiveId&&!h.goalId);
  if(looseHabits.length){
    const c=el("div","card");c.style.marginTop="12px";
    c.appendChild(el("h2","","Hábitos sin objetivo"));
    c.appendChild(el("div","sub","No están sumando a ninguna meta. Tocá uno para asignarlo a un objetivo."));
    const l=el("div","golist");
    looseHabits.forEach(h=>{
      const r=el("div","goitem");
      const dt=el("span","dot");dt.style.background=h.color;dt.style.flex="none";
      r.append(dt,el("span","",h.name));
      r.onclick=()=>openHabit(h);
      l.appendChild(r);
    });
    c.appendChild(l);view.appendChild(c);
  }
}

// tarjeta de un objetivo: barra de progreso, cuánto falta, fecha límite,
// días restantes, progreso actual y estado. Se usa colgada de una meta,
// suelta, o en la mini-tarjeta de "Hoy".
function objectiveCard(o,st){
  const c=el("div","objcard");
  const oh=el("div","oh");
  const dt=el("span","dot");dt.style.background=o.color||"var(--ink-3)";dt.style.flex="none";
  oh.appendChild(dt);
  oh.appendChild(el("b","",o.name));
  const status=objStatus(st,o);
  oh.appendChild(el("span","status "+status.cls,status.label));
  oh.appendChild(el("span","opct",st.pct+"%"));
  c.appendChild(oh);

  const tr=el("div","track");const fi=el("i");
  fi.style.width=st.pct+"%";fi.style.background=o.color||"var(--ink)";tr.appendChild(fi);
  c.appendChild(tr);

  const isManual=o.mode==="manual";
  const falta=Math.max(0,st.target-st.cur);
  const box=el("div","gtab");
  const row=(lab,html,sub)=>{
    const r=el("div","r");
    r.appendChild(el("em","",lab));
    const b=el("b");b.innerHTML=html;
    if(sub){const sm=el("small","",sub);b.appendChild(sm)}
    r.appendChild(b);box.appendChild(r);
  };

  if(isManual){
    row("Estado", o.completed?"Cumplido ✓":"Pendiente",
        o.completed?(o.completedAt?("el "+fmtDate(o.completedAt)):null):"lo marcás vos cuando lo logres");
  }else if(o.mode==="auto"){
    row("Progreso", st.pct+"%");
    if(st.win) row("Marcas cumplidas", Math.round(st.win.sum*10)/10+" / "+st.win.tot, "días cumplidos sobre el total de los períodos");
  }else{
    row("Progreso", fmtObjective(st.cur,o,true)+" / "+fmtObjective(st.target,o), st.pct+"%");
  }
  if(!isManual) row("Faltan", st.pct>=100?"Completo 🎉":fmtObjective(falta,o,true));

  if(st.effDeadline&&!(isManual&&o.completed)){
    row(o.deadline?"Fecha límite":"Fin del período", fmtDate(st.effDeadline));
    const dlt=st.daysLeft;
    row("Días restantes", dlt>=0?(dlt+" día"+(dlt===1?"":"s")):"venció");
  }

  if(st.pct<100&&!isManual){
    const isWeekly=o.mode==="days";
    const paceVal=isWeekly?st.pace:st.paceDaily;
    if(paceVal!=null) row("Ritmo actual", fmtObjective(paceVal,o,true)+" / "+(isWeekly?"semana":"día"));
    if(st.effDeadline&&st.daysLeft>0&&!st.win){
      const needVal=isWeekly?st.weekly:st.daily;
      row("Ritmo necesario", needVal!=null?(fmtObjective(needVal,o,true)+" / "+(isWeekly?"semana":"día")):"—");
    }
  }
  c.appendChild(box);

  const proj=projectNode(o,st);
  if(proj){
    const pb=el("div","projbox "+(proj.onTrack?"ok":"warn"));
    pb.innerHTML="<i>"+(proj.onTrack?"📈":"⚠️")+"</i><div>A este ritmo vas a llegar a <b>"+fmtObjective(proj.projected,o,true)+"</b> ("+proj.pct+"%) para el "+fmtDate(st.effDeadline)+
      (proj.onTrack?", superando el objetivo.":". No llega — convendría subir el ritmo.")+"</div>";
    c.appendChild(pb);
  }

  if(!o.goalId){
    const w2=el("div","chips");w2.style.marginTop="8px";
    w2.appendChild(chip("Meta","<b>sin asignar</b>"));
    c.appendChild(w2);
  }

  if(isManual){
    const tg=el("button","btn "+(o.completed?"sec":"pri"),o.completed?"↩ Reabrir objetivo":"✓ Marcar como cumplido");
    tg.style.marginTop="10px";
    tg.onclick=e=>{
      e.stopPropagation();
      o.completed=!o.completed;
      o.completedAt=o.completed?iso(today()):null;
      touch();
      if(o.completed) toast("¡Objetivo cumplido! 🎉");
      render();
    };
    c.appendChild(tg);
    c.style.cursor="pointer";
    c.onclick=()=>openObjective(o);
    return c;
  }

  const hs=objectiveHabits(o);
  if(hs.length){
    const gl=el("div","golist");
    hs.forEach(h=>{
      const win=hasWin(h);
      let ptxt,pv;
      if(win){
        const ds=daysRange(h.objFrom,h.objTo).filter(d=>applies(h,d));
        const dn=ds.filter(d=>done(h,d)).length;
        ptxt=dn+"/"+ds.length;pv=ds.length?dn/ds.length*100:0;
      }else{
        const hs2=habitStats(h,st.daysNow.length?st.daysNow:[iso(today())]);
        ptxt=hs2.pct+"%";pv=hs2.pct;
      }
      const r=el("div","goitem");
      const d2=el("span","dot");d2.style.background=h.color;d2.style.flex="none";
      const sp=el("span","",h.name);
      const b=el("b","",ptxt);
      b.style.color=pv>=80?"var(--ok)":(pv<40?"var(--ink-3)":"var(--ink)");
      if(win){
        const sm=el("small","",dm(h.objFrom)+" → "+dm(h.objTo));
        sm.style.cssText="flex:none;font-size:10.5px;font-weight:500;color:var(--ink-2)";
        r.append(d2,sp,sm,b);
      }else r.append(d2,sp,b);
      r.onclick=e=>{e.stopPropagation();openHabit(h)};
      gl.appendChild(r);
    });
    c.appendChild(gl);
  }else{
    const w=el("div","sub");w.style.marginTop="8px";
    w.textContent="Sin hábitos asignados todavía.";
    c.appendChild(w);
  }

  c.style.cursor="pointer";
  c.onclick=()=>openObjective(o);
  return c;
}

function openGoal(g){
  if(g?.archived){showArchivedGoal(g);return}
  const isNew=!g;
  const draft=g?Object.assign({},g):{
    name:"",desc:"",color:COLORS[(goalsOf().length+2)%COLORS.length],deadline:"",startDate:iso(today())
  };

  openModal(m=>{
    m.appendChild(el("h2","",isNew?"Nueva meta":"Editar meta"));

    const l1=el("label","f");l1.textContent="Nombre de la meta";
    const inp=el("input");inp.type="text";inp.value=draft.name;inp.placeholder="Ponerme en forma";
    l1.appendChild(inp);m.appendChild(l1);

    const l2=el("label","f");l2.textContent="Descripción (opcional)";
    const ta=el("textarea","tf");ta.rows=3;ta.value=draft.desc||"";
    ta.placeholder="Por qué te importa, cómo se ve cumplida…";
    l2.appendChild(ta);m.appendChild(l2);

    const startLabel=el("label","f","Fecha de inicio");
    const startInput=dateInput(draft.startDate||inferredGoalStart(draft));
    startLabel.appendChild(startInput);m.appendChild(startLabel);
    const l3=el("label","f");l3.textContent="Fecha límite (opcional)";
    const dt=dateInput(draft.deadline||"");
    dt.style.cssText="width:100%;margin-top:5px;padding:10px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:16px;font-weight:500";
    l3.appendChild(dt);m.appendChild(l3);

    const l4=el("label","f");l4.textContent="Color";
    const sws=el("div","swatches");
    COLORS.forEach(c=>{
      const b=el("button","sw"+(c===draft.color?" on":""));b.style.background=c;
      b.onclick=()=>{draft.color=c;sws.querySelectorAll(".sw").forEach(x=>x.classList.remove("on"));b.classList.add("on")};
      sws.appendChild(b);
    });
    l4.appendChild(sws);m.appendChild(l4);

    if(!isNew){
      const s=goalStats(g);
      const info=el("div","sub");
      info.style.margin="-4px 0 12px";
      info.textContent=s.total
        ? (s.total===1?"1 objetivo · ":s.total+" objetivos · ")+s.pct+"% de progreso general"
        : "Todavía sin objetivos. Agregalos desde la tarjeta de la meta.";
      m.appendChild(info);
    }

    const save=el("button","btn pri","Guardar");
    save.onclick=()=>{
      const name=inp.value.trim();
      if(!name){inp.focus();return}
      if(!validGoalDate(startInput.value)){toast("Ingresá una fecha de inicio válida");startInput.focus();return}
      if(dt.value&&dt.value<startInput.value){toast("La fecha límite no puede ser anterior al inicio");dt.focus();return}
      if(isNew){
        const goal={id:"g"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
          name,desc:ta.value.trim(),color:draft.color,deadline:dt.value||null,
          startDate:startInput.value||iso(today()),createdAt:new Date().toISOString(),archived:false,progressHistory:[]};
        state.goals.push(goal);
      }else{
        g.name=name;g.desc=ta.value.trim();g.color=draft.color;g.deadline=dt.value||null;
        if(startInput.value!==g.startDate){g.startDate=startInput.value||iso(today());g.startDateInferred=false}
      }
      touch();closeModal();tab="metas";render();
    };
    m.appendChild(save);

    if(!isNew){
      m.appendChild(archiveButton("Archivar meta",()=>requestArchiveGoal(g)));
      const del=el("button","btn dan","Borrar meta");
      del.onclick=()=>{
        askConfirm("¿Borrar la meta “"+g.name+"”? Sus objetivos siguen existiendo, solo quedan sueltos.",()=>{
          state.goals=state.goals.filter(x=>x!==g);
          state.objectives.forEach(o=>{if(o.goalId===g.id)o.goalId=null});
          state.habits.forEach(h=>{if(h.goalId===g.id)delete h.goalId});
          touch();closeModal();render();
        });
      };
      m.appendChild(del);
    }
    const cn=el("button","btn sec","Cancelar");cn.onclick=closeModal;m.appendChild(cn);
    if(isNew) setTimeout(()=>inp.focus(),80);
  });
}

// modal de un OBJETIVO: nombre, meta a la que pertenece, valor objetivo,
// fecha límite, hábitos relacionados y tipo de progreso cuando corresponda.
// presetGoalId: si se abre "+ Nuevo objetivo" desde adentro de una meta,
// esa meta queda preseleccionada.
function openObjective(o,presetGoalId){
  const parent=goalById(o?.goalId||presetGoalId);
  if(parent?.archived){showArchivedGoal(parent);return}
  const isNew=!o;
  const draft=o?Object.assign({},o):{
    name:"",goalId:presetGoalId||(goalsOf()[0]?goalsOf()[0].id:""),
    mode:"auto",target:null,unit:"",deadline:"",completed:false,
    color:COLORS[(objectivesOf().length+1)%COLORS.length]
  };
  let picked=new Set(isNew?[]:state.habits.filter(h=>h.objectiveId===o.id).map(h=>h.id));
  const dstyle="width:100%;margin-top:5px;padding:10px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:16px;font-weight:500";

  openModal(m=>{
    m.appendChild(el("h2","",isNew?"Nuevo objetivo":"Editar objetivo"));

    const l1=el("label","f");l1.textContent="Nombre del objetivo";
    const inp=el("input");inp.type="text";inp.value=draft.name;inp.placeholder="Correr 50 km este mes";
    l1.appendChild(inp);m.appendChild(l1);

    const l2=el("label","f");l2.textContent="Meta a la que pertenece";
    const gsel=el("select");
    if(!goalsOf().length){
      const o0=el("option","","Creá primero una meta");o0.value="";gsel.appendChild(o0);
    }
    goalsOf().forEach(gg=>{
      const op=el("option","",gg.name);op.value=gg.id;
      if(draft.goalId===gg.id)op.selected=true;
      gsel.appendChild(op);
    });
    l2.appendChild(gsel);m.appendChild(l2);
    if(!goalsOf().length){
      const gh=el("div","sub");gh.style.margin="-6px 0 12px";
      gh.textContent="Todavía no creaste metas. Podés hacerlo desde el botón “Nueva meta”.";
      m.appendChild(gh);
    }

    const l3=el("label","f");l3.textContent="Tipo de progreso";
    const sel=el("select");
    [["auto","Promedio de cumplimiento de los hábitos"],
     ["sum","Cantidad acumulada (km, páginas, horas…)"],
     ["days","Días en que cumpliste todo"],
     ["manual","Manual: sin hábitos, lo marco yo cuando lo cumplo"]].forEach(([v,t])=>{
      const op=el("option","",t);op.value=v;if(v===draft.mode)op.selected=true;sel.appendChild(op);
    });
    l3.appendChild(sel);m.appendChild(l3);

    const l4=el("label","f");
    const l4t=document.createTextNode("Valor objetivo");l4.appendChild(l4t);
    const num=el("input");num.type="number";num.step="0.1";num.min="0";num.value=draft.target||"";
    l4.appendChild(num);m.appendChild(l4);

    const l4b=el("label","f");l4b.textContent="Unidad (km, páginas, libros, horas…)";
    const uinp=el("input");uinp.type="text";uinp.value=draft.unit||"";uinp.placeholder="km";
    l4b.appendChild(uinp);m.appendChild(l4b);

    const hint=el("div","sub");hint.style.margin="-6px 0 12px";m.appendChild(hint);

    // objetivo manual: casilla de "ya lo cumplí"
    const doneBox=el("div","pickbox");doneBox.style.marginBottom="12px";
    const dp=el("div","p"+(draft.completed?" on":""));
    const dck=el("div","ck",draft.completed?"✓":"");
    dp.append(dck,el("span","","Ya lo cumplí"));
    dp.onclick=()=>{
      draft.completed=!draft.completed;
      dp.classList.toggle("on",!!draft.completed);
      dck.textContent=draft.completed?"✓":"";
    };
    doneBox.appendChild(dp);m.appendChild(doneBox);

    const l5=el("label","f");l5.textContent="Fecha límite (opcional)";
    const dt=dateInput(draft.deadline||"");
    dt.style.cssText=dstyle;
    l5.appendChild(dt);m.appendChild(l5);

    // (div y no label: un label activaría el botón "Crear hábito" al tocar cualquier fila)
    const l6=el("div","");l6.style.cssText="display:block;margin-bottom:12px;font-size:12px;color:var(--ink-2);font-weight:600";
    const l6h=el("div","");l6h.style.cssText="display:flex;align-items:center;justify-content:space-between;gap:8px";
    l6h.appendChild(el("span","","Hábitos relacionados"));
    const newBtn=el("button","","+ Crear hábito");
    newBtn.type="button";
    newBtn.style.cssText="font-size:12px;font-weight:700;color:var(--ink);padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel)";
    l6h.appendChild(newBtn);l6.appendChild(l6h);
    const box=el("div","pickbox");
    const hs=habitsOf();
    let emptyRow=null;
    if(!hs.length){
      emptyRow=el("div","p");emptyRow.appendChild(el("span","","Todavía no creaste hábitos"));box.appendChild(emptyRow);
    }
    const wins={};     // id de hábito -> {pw, fi, ti, wh}
    function winHint(){
      return sel.value==="auto"
        ? "Para dejar este objetivo al 100% hay que cumplir el hábito todos los días de este período. Vacío = se mide desde que empezó."
        : "Solo cuenta lo que registres dentro de este período. Vacío = cuenta todo desde que empezó.";
    }
    function syncWins(){
      hs.forEach(h=>{const w=wins[h.id];if(!w)return;
        w.pw.style.display=(picked.has(h.id)&&sel.value!=="manual")?"block":"none";
        w.wh.textContent=winHint();
      });
    }
    function addRow(h){
      const otherO=h.objectiveId&&(isNew||h.objectiveId!==o.id)?objectiveById(h.objectiveId):null;
      const p=el("div","p"+(picked.has(h.id)?" on":""));
      const ck=el("div","ck",picked.has(h.id)?"✓":"");
      const dd=el("span","dot");dd.style.background=h.color;dd.style.flex="none";
      const sp=el("span","",h.name);
      p.append(ck,dd,sp);
      if(otherO) p.appendChild(el("small","","en "+otherO.name));
      box.appendChild(p);

      // período de cumplimiento diario de este hábito dentro del objetivo
      const own=!isNew&&h.objectiveId===o.id;
      const pw=el("div","pwin");
      pw.appendChild(el("div","wt","📅 ¿De qué fecha a qué fecha?"));
      const wr=el("div","wr");
      const lf=el("label","","Desde"),lt=el("label","","Hasta");
      const fi=dateInput(own&&hasWin(h)?h.objFrom:""),ti=dateInput(own&&hasWin(h)?h.objTo:"");
      lf.appendChild(fi);lt.appendChild(ti);wr.append(lf,lt);pw.appendChild(wr);
      const wh=el("div","wh","");pw.appendChild(wh);
      box.appendChild(pw);
      wins[h.id]={pw,fi,ti,wh};

      p.onclick=()=>{
        if(picked.has(h.id))picked.delete(h.id);else picked.add(h.id);
        p.classList.toggle("on",picked.has(h.id));
        ck.textContent=picked.has(h.id)?"✓":"";
        syncWins();
      };
    }
    hs.forEach(addRow);
    l6.appendChild(box);

    // crear un hábito nuevo sin salir de este objetivo
    const nf=el("div","winbox");nf.style.display="none";nf.style.marginTop="8px";nf.style.marginBottom="0";
    nf.appendChild(el("div","wt","Nuevo hábito"));
    const nl1=el("label","f");nl1.textContent="Nombre";
    const ninp=el("input");ninp.type="text";ninp.placeholder="Salir a correr";
    nl1.appendChild(ninp);nf.appendChild(nl1);
    const nl2=el("label","f");nl2.textContent="Meta de horas por día (opcional)";
    const nnum=el("input");nnum.type="number";nnum.step="0.25";nnum.min="0";nnum.placeholder="0 = solo tildar";
    nl2.appendChild(nnum);nf.appendChild(nl2);
    const nrow=el("div","row2");
    const ncan=el("button","btn sec","Cancelar");ncan.type="button";
    const nok=el("button","btn pri","Crear y agregar");nok.type="button";
    nrow.append(ncan,nok);nf.appendChild(nrow);
    nf.appendChild(el("div","wh","Se crea para todos los días. Después podés cambiar color y días desde la pestaña Hábitos."));
    l6.appendChild(nf);
    m.appendChild(l6);

    newBtn.onclick=()=>{
      const open=nf.style.display==="none";
      nf.style.display=open?"block":"none";
      if(open){ninp.focus();nf.scrollIntoView({block:"nearest"})}
    };
    ncan.onclick=()=>{nf.style.display="none";ninp.value="";nnum.value=""};
    nok.onclick=()=>{
      const nm=ninp.value.trim();
      if(!nm){ninp.focus();return}
      const t=parseFloat(nnum.value)||null;
      addHabit(nm,COLORS[state.habits.length%COLORS.length],[0,1,2,3,4,5,6],t);
      const nh=state.habits[state.habits.length-1];
      hs.push(nh);picked.add(nh.id);
      if(emptyRow){emptyRow.remove();emptyRow=null}
      addRow(nh);
      // la fila nueva queda antes del formulario? el formulario está fuera de la caja, así que solo hay que refrescar
      syncWins();
      ninp.value="";nnum.value="";nf.style.display="none";
      toast("Hábito creado y agregado");
    };

    function refresh(){
      draft.mode=sel.value;
      const auto=draft.mode==="auto",manual=draft.mode==="manual";
      l4.style.display=(auto||manual)?"none":"block";
      l4b.style.display=draft.mode==="sum"?"block":"none";
      l6.style.display=manual?"none":"block";
      doneBox.style.display=manual?"block":"none";
      l4t.nodeValue=draft.mode==="sum"?"Valor objetivo":"Cantidad de días";
      num.placeholder=draft.mode==="sum"?"50":"20";
      hint.textContent=manual
        ? "No depende de hábitos: vos lo marcás como cumplido cuando lo logres."
        : auto
        ? "El objetivo llega a 100% cuando cumplís todos los hábitos relacionados."
        : (draft.mode==="sum"
          ? "Se suma lo que cargues día a día en los hábitos relacionados hasta llegar al valor objetivo."
          : "Cuenta los días en que cumpliste todos los hábitos relacionados.");
      syncWins();
    }
    sel.onchange=refresh;refresh();

    const save=el("button","btn pri","Guardar");
    save.onclick=()=>{
      const name=inp.value.trim();
      if(!name){inp.focus();return}
      if(!gsel.value){gsel.focus();return}
      const mode=sel.value;
      const manual=mode==="manual";
      const tgt=(mode==="auto"||manual)?null:(parseFloat(num.value)||0);
      if(!manual&&mode!=="auto"&&!tgt){num.focus();return}

      // validar los períodos de los hábitos elegidos
      const rawOf=e=>_nativeVal.get.call(e);
      if(!manual){
        for(const id of picked){
          const w=wins[id];if(!w)continue;
          const f=w.fi.value,t=w.ti.value;
          const partial=(rawOf(w.fi)&&!f)||(rawOf(w.ti)&&!t);
          if(partial||(f&&!t)||(!f&&t)){
            toast("Completá las dos fechas del período (Desde y Hasta)");
            (f&&!t||rawOf(w.ti)&&!t?w.ti:w.fi).focus();
            w.pw.scrollIntoView({block:"center"});return;
          }
          if(f&&t&&f>t){
            toast("“Desde” no puede ser posterior a “Hasta”");
            w.fi.focus();w.pw.scrollIntoView({block:"center"});return;
          }
        }
      }

      let obj;
      if(isNew){
        obj={id:"o"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
          goalId:gsel.value,name,mode,target:tgt,unit:mode==="sum"?uinp.value.trim():"",
          deadline:dt.value||null,since:iso(today()),color:draft.color,archived:false};
        state.objectives.push(obj);
      }else{
        obj=o;obj.goalId=gsel.value;obj.name=name;obj.mode=mode;obj.target=tgt;
        obj.unit=mode==="sum"?uinp.value.trim():"";obj.deadline=dt.value||null;
      }
      if(manual){
        obj.completed=!!draft.completed;
        obj.completedAt=obj.completed?(obj.completedAt||iso(today())):null;
      }else{
        delete obj.completed;delete obj.completedAt;
      }
      state.habits.forEach(h=>{
        if(!manual&&picked.has(h.id)){
          h.objectiveId=obj.id;
          const w=wins[h.id];
          if(w&&w.fi.value&&w.ti.value){h.objFrom=w.fi.value;h.objTo=w.ti.value}
          else{delete h.objFrom;delete h.objTo}
        }else if(h.objectiveId===obj.id){
          delete h.objectiveId;delete h.objFrom;delete h.objTo;
        }
      });
      touch();closeModal();tab="metas";render();
    };
    m.appendChild(save);

    if(!isNew){
      const row=el("div","row2");
      const pa=el("button","btn sec",o.archived?"Reactivar":"Pausar");
      pa.onclick=()=>{o.archived=!o.archived;touch();closeModal();tab="metas";render()};
      const del=el("button","btn dan","Borrar objetivo");
      del.onclick=()=>{
        askConfirm("¿Borrar el objetivo “"+o.name+"”? Los hábitos siguen existiendo, solo quedan sueltos.",()=>{
          state.objectives=state.objectives.filter(x=>x!==o);
          state.habits.forEach(h=>{if(h.objectiveId===o.id){delete h.objectiveId;delete h.objFrom;delete h.objTo}});
          touch();closeModal();render();      // se cierra la ventana del objetivo y te quedás donde estabas
        });
      };
      row.append(pa,del);m.appendChild(row);
    }
    const cn=el("button","btn sec","Cancelar");cn.onclick=closeModal;m.appendChild(cn);
    if(isNew) setTimeout(()=>inp.focus(),80);
  });
}

let calMode="agenda",calSel=null;

const evsOf=()=>(state.events||[]);
function eventsOn(d){return evsOf().filter(e=>e.date===d).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"))}
function dayPct(d){const st=rangeStats(habitsOf(),[d]);return st.tot?st.pct:null}
function lvl(p){if(p==null)return -1;if(p<=0)return 0;if(p<40)return 1;if(p<70)return 2;if(p<100)return 3;return 4}

function calAgenda(){
  const y=cursor.getFullYear(),m=cursor.getMonth();
  const first=new Date(y,m,1),lead=dow(first),ndays=new Date(y,m+1,0).getDate();
  const total=Math.ceil((lead+ndays)/7)*7;
  const t=iso(today());

  const c=el("div","card");
  const g=el("div","calgrid");
  DAYN.forEach(d=>g.appendChild(el("div","dn",d)));
  for(let i=0;i<total;i++){
    const dt=addDays(first,i-lead),d=iso(dt);
    const out=dt.getMonth()!==m;
    const cell=el("div","cday"+(out?" out":"")+(d===t?" today":"")+(d===calSel?" sel":""));
    cell.appendChild(el("div","d",String(dt.getDate())));
    const evs=eventsOn(d);
    if(evs.length){
      const dots=el("div","dots");
      evs.slice(0,3).forEach(e=>{const i2=el("i");i2.style.background=e.color||"#2C8CB4";dots.appendChild(i2)});
      cell.appendChild(dots);
    }
    const p=dayPct(d);
    if(p!=null&&!out){
      const r=el("div","ring");const u=el("u");u.style.width=p+"%";
      u.style.background=p>=100?"var(--ok)":"var(--ink-3)";
      r.appendChild(u);cell.appendChild(r);
    }
    cell.onclick=()=>{calSel=d;if(out)cursor=new Date(dt.getFullYear(),dt.getMonth(),1);render()};
    g.appendChild(cell);
  }
  c.appendChild(g);
  view.appendChild(c);

  // panel del día elegido
  const sel=calSel&&fromIso(calSel).getMonth()===m?calSel:null;
  const dsel=sel||(fromIso(t).getMonth()===m&&fromIso(t).getFullYear()===y?t:iso(first));
  const dd=fromIso(dsel);
  const p=el("div","card");
  p.appendChild(el("h2","",cap(DAYFULL[dow(dd)])+" "+dd.getDate()+" de "+MONTHS[dd.getMonth()]));
  const dstats=rangeStats(habitsOf(),[dsel]);
  if(dstats.tot){
    const hero=el("div","hero");hero.style.marginTop="4px";
    const big=el("div","big n");big.style.fontSize="38px";big.innerHTML=dstats.pct+"<i>%</i>";
    hero.appendChild(big);
    const lbl=el("div","sub",dstats.fullDays+" de "+dstats.tot+" hábitos completados");
    lbl.style.paddingBottom="6px";hero.appendChild(lbl);
    p.appendChild(hero);
    const tr=el("div","track");const fi=el("i");
    fi.style.width=dstats.pct+"%";fi.style.background=dstats.pct>=80?"var(--ok)":"var(--ink)";
    tr.appendChild(fi);p.appendChild(tr);
  }else{
    p.appendChild(el("div","sub","sin hábitos programados ese día"));
  }
  const habitsToday=habitsOf().filter(h2=>applies(h2,dsel));
  if(habitsToday.length){
    const hl=el("div","golist");hl.style.marginTop="10px";
    habitsToday.forEach(h2=>{
      const okD=done(h2,dsel);
      const r=el("div","goitem");
      const mark=el("span","",okD?"✓":"○");
      mark.style.cssText="flex:none;font-weight:700;width:14px;color:"+(okD?"var(--ok)":"var(--ink-3)");
      const dt2=el("span","dot");dt2.style.background=h2.color;dt2.style.flex="none";
      const sp=el("span","",h2.name);
      const b=el("b","",h2.type==="hours"?fmtH(val(h2,dsel)):(okD?"hecho":"—"));
      r.append(mark,dt2,sp,b);
      r.onclick=()=>{cursor=fromIso(dsel);tab="hoy";window.scrollTo(0,0);render()};
      hl.appendChild(r);
    });
    p.appendChild(hl);
  }
  const evs=eventsOn(dsel);
  const evh=el("div");evh.style.margin="14px 0 0";
  evh.appendChild(el("h2","","Eventos"));evh.style.fontSize="13px";
  p.appendChild(evh);
  if(evs.length){
    const l=el("div","evlist");
    evs.forEach(e=>l.appendChild(evRow(e)));
    p.appendChild(l);
  }else{
    const n=el("div","sub");n.style.marginTop="6px";n.textContent="No hay eventos agendados.";p.appendChild(n);
  }
  const b=el("button","btn pri","Agendar evento");
  b.onclick=()=>openEvent(null,dsel);
  p.appendChild(b);
  view.appendChild(p);

  // próximos
  const next=evsOf().filter(e=>e.date>=t).sort((a,b)=>(a.date+(a.time||"99")).localeCompare(b.date+(b.time||"99"))).slice(0,5);
  if(next.length){
    const c2=el("div","card");
    c2.appendChild(el("h2","","Lo que viene"));
    const l=el("div","evlist");
    next.forEach(e=>l.appendChild(evRow(e,true)));
    c2.appendChild(l);view.appendChild(c2);
  }
}

      '<span>'+cap(MONTHS[now.getMonth()])+" "+a.pct+"% · "+cap(MONTHS[pm.getMonth()])+" "+b.pct+'%</span>';
  }else{
    v.innerHTML='<span>Todavía no hay dos meses completos para comparar. Seguí cargando y acá vas a ver la diferencia.</span>';
  }
  c2.appendChild(v);
  const gs=globalStreak();
  c2.appendChild(streakBoxes(gs,"días perfectos seguidos"));
  view.appendChild(c2);

  const tip=el("div","sub","Tocá cualquier cuadrito para abrir ese día y completarlo.");
  tip.style.padding="0 2px";view.appendChild(tip);

/* ---------------- TRABAJO ---------------- */
const workOf=()=>(state.work||{});
function workDay(d){return (state.work||{})[d]||null}
function workH(d){const w=workDay(d);return w?(w.h||0):0}
function workRange(days){let t=0;days.forEach(d=>{t+=workH(d)});return t}
function hoursBetween(a,b){
  if(!a||!b)return 0;
  const[p,q]=a.split(":").map(Number),[r,u]=b.split(":").map(Number);
  let m=(r*60+u)-(p*60+q);
  if(m<0)m+=1440;                      // turno que cruza la medianoche
  return Math.round(m/60*100)/100;
}
function setWork(d,o){
  if(!state.work)state.work={};
  if(!o||!o.h){delete state.work[d]}else{state.work[d]=o}
}
function quincenas(y,m){
  const days=monthDays(new Date(y,m,1));
  const q1=days.filter(d=>fromIso(d).getDate()<=14);
  const q2=days.filter(d=>fromIso(d).getDate()>14);
  return {q1:workRange(q1),q2:workRange(q2),tot:workRange(days),
          d1:q1.filter(d=>workH(d)>0).length,d2:q2.filter(d=>workH(d)>0).length};
}

let qCursor=new Date();
function viewTrabajo(){
  const days=weekDays(cursor);
  const a=fromIso(days[0]),b=fromIso(days[6]);
  const tot=workRange(days);

  const c=el("div","card");
  c.appendChild(el("h2","","Horarios de la semana"));
  c.appendChild(el("div","sub",a.getDate()+" "+MONTHS[a.getMonth()].slice(0,3)+" – "+b.getDate()+" "+MONTHS[b.getMonth()].slice(0,3)+" · semana "+weekNum(a)));

  const hero=el("div","hero");hero.style.marginTop="10px";
  const n=el("div","big n");n.style.fontSize="46px";
  n.innerHTML=fmtH(tot).replace(/(\d+)/g,"$1").replace(" h","<i> h</i>").replace(" m","<i> m</i>");
  hero.appendChild(n);
  const lb=el("div");lb.style.paddingBottom="6px";
  const wd=days.filter(d=>workH(d)>0).length;
  lb.appendChild(el("div","","trabajadas esta semana"));
  lb.appendChild(el("div","sub",wd+" día"+(wd===1?"":"s")+(wd?" · promedio "+fmtH(tot/wd)+" por día":"")));
  hero.appendChild(lb);
  c.appendChild(hero);

  const list=el("div");list.style.marginTop="10px";
  const t=iso(today());
  days.forEach((d,i)=>{
    const w=workDay(d),dt=fromIso(d);
    const r=el("div","wday"+(w?"":" off"));
    const dn=el("div","dn2");dn.textContent=cap(DAYFULL[i]).slice(0,3)+" "+dt.getDate();
    if(d===t)dn.style.color="#D8453B";
    const sm=el("small","",d===t?"hoy":MONTHS[dt.getMonth()].slice(0,3));
    dn.appendChild(sm);
    const rg=el("div","rg",w&&w.from&&w.to?(w.from+" – "+w.to+(w.note?" · "+w.note:"")):(w?"carga manual":"libre"));
    const hh=el("div","hh",w?fmtH(w.h):"—");
    r.append(dn,rg,hh);
    r.onclick=()=>openWork(days,i);
    list.appendChild(r);
  });
  c.appendChild(list);

  const tap=el("div","tapzone","✎ Tocá acá para cargar los horarios de esta semana");
  tap.onclick=()=>openWork(days,0);
  c.appendChild(tap);
  view.appendChild(c);

  // quincenas
  const q=el("div","card");
  q.appendChild(el("h2","","Horas por quincena"));
  const bar=el("div","yearbar");
  const pv=el("button","mini","‹");
  const yl=el("div","y",cap(MONTHS[qCursor.getMonth()])+" "+qCursor.getFullYear());
  const nx=el("button","mini","›");
  pv.onclick=()=>{qCursor=new Date(qCursor.getFullYear(),qCursor.getMonth()-1,1);render()};
  nx.onclick=()=>{qCursor=new Date(qCursor.getFullYear(),qCursor.getMonth()+1,1);render()};
  bar.append(pv,yl,nx);q.appendChild(bar);

  const qq=quincenas(qCursor.getFullYear(),qCursor.getMonth());
  const g=el("div","qgrid");
  const box=(t2,v,sub)=>{const b2=el("div","qbox");b2.appendChild(el("em","",t2));
    b2.appendChild(el("b","",fmtH(v)));b2.appendChild(el("small","",sub));return b2};
  g.append(box("1ra quincena",qq.q1,"días 1 al 14 · "+qq.d1+" día"+(qq.d1===1?"":"s")),
           box("2da quincena",qq.q2,"del 15 en adelante · "+qq.d2+" día"+(qq.d2===1?"":"s")));
  q.appendChild(g);

  const tr=el("div","totrow");
  tr.appendChild(el("span","","Total de "+MONTHS[qCursor.getMonth()]));
  tr.appendChild(el("b","",fmtH(qq.tot)));
  q.appendChild(tr);

  const prev=new Date(qCursor.getFullYear(),qCursor.getMonth()-1,1);
  const pt=workRange(monthDays(prev));
  if(pt||qq.tot){
    const v=el("div","verdict");
    const df=Math.round((qq.tot-pt)*100)/100;
    v.innerHTML='<b class="'+(df>=0?"up":"down")+'">'+(df>=0?"+":"–")+fmtH(Math.abs(df))+'</b><span>respecto de '+MONTHS[prev.getMonth()]+' ('+fmtH(pt)+').</span>';
    q.appendChild(v);
  }
  view.appendChild(q);

  // últimos 6 meses
  const ms=[],lb2=[];
  for(let i=5;i>=0;i--){
    const d=new Date(qCursor.getFullYear(),qCursor.getMonth()-i,1);
    ms.push(workRange(monthDays(d)));lb2.push(MONTHS[d.getMonth()].slice(0,3));
  }
  if(ms.some(x=>x>0)){
    const c3=el("div","card");
    c3.appendChild(el("h2","","Cómo viene el año"));
    c3.appendChild(el("div","sub","horas de trabajo por mes"));
    const mx=Math.max(...ms);
    c3.appendChild(lineChart(ms,lb2,"#5F7280",{h:110,max:Math.ceil(mx/10)*10||10,fmt:v=>Math.round(v)+"h"}));
    view.appendChild(c3);
  }

  const tip=el("div","sub","Las horas de trabajo no afectan el cumplimiento de tus hábitos: se miden aparte y aparecen en Stats, en el gráfico que incluye el trabajo.");
  tip.style.padding="0 2px";view.appendChild(tip);
}

function openWork(days,focus){
  const draft=days.map(d=>{
    const w=workDay(d);
    return {d,from:w&&w.from||"",to:w&&w.to||"",h:w?w.h:0,note:w&&w.note||""};
  });
  openModal(m=>{
    const a=fromIso(days[0]),b=fromIso(days[6]);
    m.appendChild(el("h2","","Horarios de trabajo"));
    m.appendChild(el("div","sub",a.getDate()+" "+MONTHS[a.getMonth()].slice(0,3)+" – "+b.getDate()+" "+MONTHS[b.getMonth()].slice(0,3)+" · poné entrada y salida, o escribí las horas a mano"));

    const tot=el("div","hournum");tot.style.fontSize="30px";
    const rows=el("div");rows.style.marginTop="6px";
    const paintTot=()=>{
      let t=0;draft.forEach(x=>{t+=x.h||0});
      tot.textContent=fmtH(Math.round(t*100)/100)+" en la semana";
    };
    const inputs=[];
    draft.forEach((x,i)=>{
      const dt=fromIso(x.d);
      const r=el("div","wrow");
      r.appendChild(el("div","wd",DAYN[i]+dt.getDate()));
      const f=timeInput(x.from);
      const t2=timeInput(x.to);
      const eq=el("div","eq","=");
      const h=el("input");h.type="number";h.step="0.25";h.min="0";h.value=x.h||"";h.placeholder="0";
      const recalc=()=>{
        x.from=f.value;x.to=t2.value;
        if(f.value&&t2.value){x.h=hoursBetween(f.value,t2.value);h.value=x.h||""}
        paintTot();
      };
      f.addEventListener("input",recalc);t2.addEventListener("input",recalc);
      h.addEventListener("input",()=>{x.h=Math.max(0,parseFloat(h.value)||0);paintTot()});
      r.append(f,t2,eq,h);
      rows.appendChild(r);
      inputs.push({f,t2,h,x});
    });
    m.append(tot,rows);
    paintTot();

    const q=el("div","quick");
    const rep=el("button","","Copiar el 1er día a toda la semana");
    rep.onclick=()=>{
      const src=draft[0];
      inputs.forEach((it,i)=>{
        if(i===0)return;
        const wd=dow(fromIso(it.x.d));
        if(wd>4)return;                      // no pisa sábado y domingo
        it.x.from=src.from;it.x.to=src.to;it.x.h=src.h;
        it.f.value=src.from;it.t2.value=src.to;it.h.value=src.h||"";
      });
      paintTot();
    };
    const cl=el("button","","Vaciar semana");
    cl.onclick=()=>{
      inputs.forEach(it=>{it.x.from="";it.x.to="";it.x.h=0;it.f.value="";it.t2.value="";it.h.value=""});
      paintTot();
    };
    q.append(rep,cl);m.appendChild(q);

    const save=el("button","btn pri","Guardar la semana");
    save.onclick=()=>{
      draft.forEach(x=>setWork(x.d,x.h?{h:Math.round(x.h*100)/100,from:x.from,to:x.to,note:x.note}:null));
      touch();closeModal();render();toast("Horarios guardados");
    };
    m.appendChild(save);
    const cn=el("button","btn sec","Cancelar");cn.onclick=closeModal;m.appendChild(cn);
    if(focus!=null) setTimeout(()=>{const it=inputs[focus];if(it)it.f.focus()},120);
  });
}

/* ---------------- NOTAS ---------------- */
const notesOf=()=>(state.notes||[]);
function viewNotas(){
  const c=el("div","card");
  c.appendChild(el("h2","","Notas"));
  c.appendChild(el("div","sub","recordatorios, ideas, listas: lo que necesites tener a mano"));
  const b=el("button","btn pri","Escribir una nota");b.onclick=()=>openNote(null);
  c.appendChild(b);
  view.appendChild(c);

  const ns=notesOf().slice().sort((a,b2)=>(b2.pinned?1:0)-(a.pinned?1:0)||(b2.updatedAt||0)-(a.updatedAt||0));
  if(!ns.length){
    const e=el("div","card empty");
    e.appendChild(el("h2","","Todavía no hay notas"));
    e.appendChild(el("p","","Guardá acá lo que no querés que se te escape: “llamar al dentista”, la lista del súper, una idea suelta."));
    view.appendChild(e);
    return;
  }
  const g=el("div","notegrid");
  ns.forEach(n=>{
    const card=el("div","note");
    if(n.color){
      // color sólido; el texto se adapta (claro u oscuro) según qué tan claro sea el fondo
      const x=n.color.replace("#","");
      const lum=(0.299*parseInt(x.slice(0,2),16)+0.587*parseInt(x.slice(2,4),16)+0.114*parseInt(x.slice(4,6),16))/255;
      const fg=lum>0.62?"#14232B":"#FFFFFF";
      card.style.background=n.color;
      card.style.borderColor=n.color;
      card.style.color=fg;
      card.classList.add("solid");
    }
    if(n.title) card.appendChild(el("h3","",n.title));
    if(n.text) card.appendChild(el("p","",n.text));
    const f=el("div","nf");
    f.appendChild(el("span","",fechaCorta(n.updatedAt)));
    if(n.pinned){const p=el("span","pn","📌");f.appendChild(p)}
    card.appendChild(f);
    card.onclick=()=>openNote(n);
    g.appendChild(card);
  });
  view.appendChild(g);
}
function hexA(h,a){
  const x=h.replace("#","");
  const r=parseInt(x.slice(0,2),16),g=parseInt(x.slice(2,4),16),b=parseInt(x.slice(4,6),16);
  return "rgba("+r+","+g+","+b+","+a+")";
}
function fechaCorta(ts){
  if(!ts)return "";
  const d=new Date(ts),t=today();
  const dd=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff=Math.round((t-dd)/86400000);
  if(diff===0)return "hoy "+pad(d.getHours())+":"+pad(d.getMinutes());
  if(diff===1)return "ayer";
  return d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3);
}
function openNote(n){
  const isNew=!n;
  const draft=n?Object.assign({},n):{title:"",text:"",color:"",pinned:false};
  openModal(m=>{
    m.appendChild(el("h2","",isNew?"Nueva nota":"Nota"));
    const l1=el("label","f");l1.textContent="Título (opcional)";
    const ti=el("input");ti.type="text";ti.value=draft.title;ti.placeholder="Comprar";
    l1.appendChild(ti);m.appendChild(l1);

    const l2=el("label","f");l2.textContent="Contenido";
    const ta=el("textarea","note-ta");ta.value=draft.text;ta.placeholder="Escribí lo que quieras recordar…";
    l2.appendChild(ta);m.appendChild(l2);

    const l3=el("label","f");l3.textContent="Color";
    const sws=el("div","swatches");
    const none=el("button","sw"+(draft.color?"":" on"));
    none.style.background="var(--panel-2)";none.style.borderColor="var(--line)";
    none.onclick=()=>{draft.color="";sws.querySelectorAll(".sw").forEach(x=>x.classList.remove("on"));none.classList.add("on")};
    sws.appendChild(none);
    COLORS.forEach(c=>{
      const b=el("button","sw"+(c===draft.color?" on":""));b.style.background=c;
      b.onclick=()=>{draft.color=c;sws.querySelectorAll(".sw").forEach(x=>x.classList.remove("on"));b.classList.add("on")};
      sws.appendChild(b);
    });
    l3.appendChild(sws);m.appendChild(l3);

    const r=el("div","hlist");
    r.append(el("div","nm","📌 Fijar arriba"));
    const sw=el("button","mini",draft.pinned?"✓":"");
    sw.onclick=()=>{draft.pinned=!draft.pinned;sw.textContent=draft.pinned?"✓":""};
    r.appendChild(sw);m.appendChild(r);

    const save=el("button","btn pri","Guardar");
    save.onclick=()=>{
      const ti2=ti.value.trim(),tx=ta.value;
      if(!ti2&&!tx.trim()){ta.focus();return}
      if(isNew){
        state.notes.push({id:"n"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
          title:ti2,text:tx,color:draft.color,pinned:draft.pinned,updatedAt:Date.now()});
      }else{
        n.title=ti2;n.text=tx;n.color=draft.color;n.pinned=draft.pinned;n.updatedAt=Date.now();
      }
      touch();closeModal();render();
    };
    m.appendChild(save);
    if(!isNew){
      const del=el("button","btn dan","Borrar nota");
      del.onclick=()=>{
        askConfirm("¿Borrar esta nota?",()=>{
          state.notes=state.notes.filter(x=>x!==n);touch();closeModal();render();
        });
      };
      m.appendChild(del);
    }
    const cn=el("button","btn sec","Cancelar");cn.onclick=closeModal;m.appendChild(cn);
    if(isNew) setTimeout(()=>ta.focus(),80);
  });
}
