<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agen.IK</title>
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#E6EBEC;
  --panel:#F8FAFA;
  --panel-2:#EDF1F2;
  --ink:#14242D;
  --ink-2:#5F7280;
  --ink-3:#8FA0AB;
  --line:#C4D1D6;
  --line-soft:#D9E2E5;
  --shadow:rgba(20,36,45,.10);
  --ok:#1F7A4D;
  --radius:10px;
}
:root[data-theme="dark"]{
  --bg:#0F1519;
  --panel:#171F24;
  --panel-2:#1D262C;
  --ink:#E6EDEF;
  --ink-2:#93A5AF;
  --ink-3:#6B7C86;
  --line:#2C383F;
  --line-soft:#222C32;
  --shadow:rgba(0,0,0,.45);
  --ok:#5FC28C;
}
:root[data-theme="vintage"]{
  --bg:#2E2216;
  --panel:#3C2D1C;
  --panel-2:#463522;
  --ink:#F1E4CB;
  --ink-2:#C9AE83;
  --ink-3:#8F7A5B;
  --line:#5A452C;
  --line-soft:#4A3822;
  --shadow:rgba(0,0,0,.35);
  --ok:#A8B76E;
}
:root[data-theme="black"]{
  --bg:#141414;
  --panel:#1C1C1C;
  --panel-2:#242424;
  --ink:#E4E4E4;
  --ink-2:#9C9C9C;
  --ink-3:#6E6E6E;
  --line:#333333;
  --line-soft:#282828;
  --shadow:rgba(0,0,0,.5);
  --ok:#7FBF8F;
}
:root[data-theme="batman"]{
  --bg:#0A0A0C;
  --panel:#151519;
  --panel-2:#1D1D22;
  --ink:#ECECEE;
  --ink-2:#9B9BA3;
  --ink-3:#5B5B62;
  --line:#2B2B31;
  --line-soft:#212126;
  --shadow:rgba(0,0,0,.6);
  --ok:#F2C230;
}
:root[data-theme="spiderman"]{
  --bg:#10173A;
  --panel:#1B2560;
  --panel-2:#243075;
  --ink:#F5F7FF;
  --ink-2:#C7CFF2;
  --ink-3:#8B98D6;
  --line:#37449A;
  --line-soft:#293480;
  --shadow:rgba(0,0,0,.5);
  --ok:#E0202E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.45;
  padding-bottom:calc(86px + 48px + env(safe-area-inset-bottom));
  overscroll-behavior-y:auto;
  min-height:100vh;min-height:100dvh;
}
body.modal-lock{position:fixed;left:0;right:0;overflow:hidden;width:100%}
button,input,select,textarea,a{touch-action:manipulation}
body.has-bg{background:transparent}
#bgLayer{
  position:fixed;inset:-60px;z-index:-1;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  pointer-events:none;
}
h1,h2,h3,.display{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;font-weight:700;letter-spacing:-.02em;margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
button:active{transform:scale(.93)}
@keyframes btnPop{0%{transform:scale(.93)}60%{transform:scale(1.035)}100%{transform:scale(1)}}
button.pop-anim{animation:btnPop .22s cubic-bezier(.34,1.56,.64,1)}
input,select,textarea{font:inherit;color:var(--ink)}
.fld-date,.fld-time{background:var(--panel);color:var(--ink);-webkit-appearance:none;appearance:none}

/* ---------- barra superior ---------- */
header{
  position:sticky;top:0;z-index:30;
  background:var(--bg);
  border-bottom:1px solid var(--line-soft);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
}
.hrow{display:flex;align-items:center;gap:10px}
.title{font-size:20px;line-height:1.1;flex:1;min-width:0}
.title small{display:block;font-family:"Instrument Sans",sans-serif;font-weight:500;font-size:12px;color:var(--ink-2);letter-spacing:0}
.iconbtn{
  width:36px;height:36px;border-radius:9px;border:1px solid var(--line);
  display:grid;place-items:center;background:var(--panel);font-size:17px;flex:none
}
.iconbtn:active{background:var(--panel-2)}
.navpill{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden;flex:none}
.navpill button{width:34px;height:34px;display:grid;place-items:center;font-size:15px;color:var(--ink-2)}
.navpill span{padding:0 10px;font-size:13px;font-weight:600;white-space:nowrap}

/* ---------- contenido ---------- */
main{padding:14px 14px 30px;max-width:900px;margin:0 auto;overflow-x:hidden}
.card{
  background:var(--panel);border:1px solid var(--line-soft);
  border-radius:var(--radius);padding:14px;margin-bottom:12px
}
.card h2{font-size:15px;margin-bottom:2px}
.sub{color:var(--ink-2);font-size:12.5px}

/* ---------- grilla tipo ficha ---------- */
.sheet{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;margin-bottom:12px
}
.scroller{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.grid{min-width:max-content}
.grow{display:flex;align-items:stretch;border-bottom:1px solid var(--line-soft)}
.grow:last-child{border-bottom:none}
.grow.head{background:var(--panel-2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.lab{
  position:sticky;z-index:6;background:var(--panel);
  width:132px;flex:none;padding:6px 9px;display:flex;flex-direction:column;justify-content:center;gap:2px;
  font-size:12.5px;font-weight:600;line-height:1.2;
}
.lab.left{left:0;border-right:1px solid var(--line)}
.lab.right{right:0;border-left:1px solid var(--line)}
.head .lab{background:var(--panel-2)}
.lab .meta{font-weight:500;font-size:10.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.cells{display:flex;flex:1}
.cell{
  width:34px;flex:none;height:34px;display:grid;place-items:center;
  border-right:1px solid var(--line-soft);
}
.cell:last-child{border-right:none}
.wide .cell{flex:1;width:auto;min-width:30px}
.wide .lab{width:112px}
.wide .pct{width:40px}
.dayhead{
  height:38px;flex-direction:column;justify-content:center;display:flex;align-items:center;
  font-size:10px;color:var(--ink-2);font-weight:600
}
.dayhead b{font-size:13px;color:var(--ink);font-family:"Bricolage Grotesque",sans-serif;font-weight:700;line-height:1}
.dayhead.today b{color:#fff;background:#D8453B;border-radius:5px;padding:1px 5px;box-shadow:0 1px 3px rgba(216,69,59,.35)}
.dayhead.today{color:#D8453B}
.dayhead.wknd{color:var(--ink-3)}
.box{
  width:22px;height:22px;border-radius:5px;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:12px;color:#fff;position:relative;overflow:hidden;
  transition:transform .12s ease
}
.box:active{transform:scale(.88)}
.box .fill{position:absolute;left:0;right:0;bottom:0}
.box .ch{position:relative;z-index:2;line-height:1;font-size:13px;font-weight:700}
.box.na{border-style:none;background:transparent}
.box.na::after{content:"";width:5px;height:1.5px;background:var(--line);border-radius:2px}
.box.fut{opacity:.55}
.pct{width:46px;flex:none;display:grid;place-items:center;font-size:11.5px;font-weight:700;
  font-family:"Bricolage Grotesque",sans-serif;border-left:1px solid var(--line);background:var(--panel)}
.grow.foot{background:var(--panel-2);border-top:1px solid var(--line)}
.grow.foot .cell{font-size:10px;font-weight:700;color:var(--ink-2);font-family:"Bricolage Grotesque",sans-serif}
.monthbar{
  display:flex;gap:8px;align-items:baseline;padding:8px 10px;border-bottom:1px solid var(--line);
  background:var(--panel-2);font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:13px;
  text-transform:none
}
.monthbar span{font-family:"Instrument Sans",sans-serif;font-weight:500;font-size:11.5px;color:var(--ink-2)}

/* ---------- hoy ---------- */
.today-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.today-item:last-child{border-bottom:none}
.today-item .nm{flex:1;min-width:0;font-weight:600;font-size:14.5px;line-height:1.25}
.today-item .nm small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-2)}
.bigbox{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;
  position:relative;overflow:hidden;flex:none;color:#fff;font-size:18px;font-weight:700}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center;font-size:15px;font-weight:700;color:var(--ink-2)}
.stepper .val{min-width:58px;text-align:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:13px}

/* ---------- stats ---------- */
.big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.04em;line-height:.92}
.hero{display:flex;align-items:flex-end;gap:14px}
.hero .n{font-size:64px}
.hero .n i{font-size:26px;font-style:normal;color:var(--ink-2)}
.kpis{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)}
.kpi{flex:1;min-width:88px}
.kpi b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:21px;font-weight:700;line-height:1.1}
.kpi span{font-size:11.5px;color:var(--ink-2)}
.bars{display:flex;align-items:flex-end;gap:5px;height:72px;margin-top:12px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:4px;align-items:center}
.bars .b i{width:100%;border-radius:3px 3px 0 0;background:var(--ink);display:block;min-height:2px;opacity:.85}
.bars .b em{font-style:normal;font-size:9.5px;color:var(--ink-3);white-space:nowrap}
.track{height:7px;border-radius:4px;background:var(--panel-2);overflow:hidden;margin-top:7px;border:1px solid var(--line-soft)}
.track i{display:block;height:100%;border-radius:4px}
.hstat{display:flex;align-items:center;gap:9px;margin-bottom:3px}
.hstat .nm{flex:1;font-weight:600;font-size:14px;min-width:0}
.hstat .p{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line-soft);color:var(--ink-2);font-weight:600}
.chip b{color:var(--ink)}


/* ---------- stats 2.0 ---------- */
.stats-tabs{position:sticky;top:8px;z-index:12;margin-bottom:10px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--panel-2) 88%,transparent);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.stats-period{display:flex;gap:6px;margin:0 0 14px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2)}
.stats-period button{flex:1;padding:9px 8px;border-radius:8px;color:var(--ink-2);font-size:12px;font-weight:750;transition:background .18s ease,color .18s ease,transform .18s ease}
.stats-period button.on{background:var(--panel);color:var(--ink);box-shadow:0 2px 8px var(--shadow)}
.stats-period button:active{transform:scale(.98)}
.stats-hero-card{overflow:hidden;position:relative;padding:18px;background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--panel) 88%,var(--ok) 12%));border-color:color-mix(in srgb,var(--line) 72%,var(--ok) 28%)}
.stats-hero-card:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-90px;top:-100px;background:radial-gradient(circle,color-mix(in srgb,var(--ok) 22%,transparent),transparent 68%);pointer-events:none}
.stats-hero-grid{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:18px;position:relative}
.stats-score{display:grid;place-items:center}
.stats-hero-copy{min-width:0}.stats-eyebrow{display:block;font-size:9.5px;letter-spacing:.13em;font-weight:800;color:var(--ok);margin-bottom:4px}.stats-hero-copy h2{font-size:24px;letter-spacing:-.035em;line-height:1.05}.stats-hero-copy p{margin:7px 0 0;color:var(--ink-2);font-size:12.5px;line-height:1.45;max-width:480px}
.stats-delta{display:inline-flex;align-items:center;margin-top:9px;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:750;line-height:1.25;background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line-soft)}
.stats-delta.up{background:rgba(46,158,99,.11);color:var(--ok);border-color:rgba(46,158,99,.18)}.stats-delta.down{background:rgba(224,138,46,.10);color:#D8892E;border-color:rgba(224,138,46,.18)}.stats-delta.flat,.stats-delta.neutral{color:var(--ink-2)}
.stats-metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:15px}
.stats-metric{display:flex;align-items:flex-start;gap:9px;min-width:0;padding:10px 11px;border-radius:11px;background:color-mix(in srgb,var(--panel-2) 92%,transparent);border:1px solid var(--line-soft)}
.stats-metric-icon{width:25px;height:25px;display:grid;place-items:center;border-radius:8px;background:rgba(46,158,99,.10);color:var(--ok);font-size:13px;font-weight:800;flex:none}.stats-metric-copy{min-width:0}.stats-metric b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:18px;line-height:1;font-weight:800;letter-spacing:-.025em}.stats-metric span:not(.stats-metric-icon){display:block;margin-top:3px;font-size:10.5px;color:var(--ink-2);font-weight:650}.stats-metric small{display:block;margin-top:2px;font-size:9.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats-grid-2{display:grid;grid-template-columns:1fr;gap:0}.stats-grid-2>.card{margin-bottom:10px}
.stats-insight-list{margin-top:8px}.stats-insight{display:grid;grid-template-columns:28px 1fr;gap:9px;padding:10px 0;border-bottom:1px solid var(--line-soft)}.stats-insight:last-child{border-bottom:0;padding-bottom:1px}.stats-insight-mark{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--panel-2);color:var(--ok);font-size:13px;font-weight:800}.stats-insight b{font-size:12px}.stats-insight p{margin:2px 0 0;color:var(--ink-2);font-size:11.5px;line-height:1.4}
.stats-rank-list{margin-top:9px}.stats-rank-row{padding:10px 0;border-bottom:1px solid var(--line-soft)}.stats-rank-row:last-child{border-bottom:0}.stats-rank-head{display:flex;align-items:end;gap:12px}.stats-rank-head>div{flex:1;min-width:0}.stats-rank-head small{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:800}.stats-rank-head b{display:block;margin-top:2px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats-rank-head strong{font-family:"Bricolage Grotesque",sans-serif;font-size:17px}.stats-rank-track{height:6px;margin-top:8px;border-radius:99px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line-soft)}.stats-rank-track i{display:block;height:100%;border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.stats-weekdays{height:132px;display:grid;grid-template-columns:repeat(7,1fr);gap:5px;align-items:end;margin-top:14px}.stats-weekday{height:100%;display:grid;grid-template-rows:18px 1fr 18px;gap:4px;align-items:end;text-align:center;min-width:0}.stats-weekday>b{font-size:9px;color:var(--ink-2)}.stats-weekday>span{font-size:9px;color:var(--ink-3);font-weight:700}.stats-weekday-bar{height:100%;display:flex;align-items:flex-end;justify-content:center;padding:0 2px;border-radius:7px;background:linear-gradient(to top,var(--panel-2),transparent)}.stats-weekday-bar i{display:block;width:100%;max-width:22px;border-radius:5px 5px 3px 3px;background:linear-gradient(to top,var(--ok),color-mix(in srgb,var(--ok) 70%,white 30%));min-height:3px;transition:height .45s cubic-bezier(.2,.8,.2,1)}
.stats-chart-card .chart{padding-top:5px}.stats-chart-card .chart svg{border-radius:10px;background:linear-gradient(180deg,color-mix(in srgb,var(--panel-2) 78%,transparent),transparent)}.stats-verdict{margin-top:7px}.stats-inline-empty{margin:12px 0 2px;padding:10px 11px;border:1px dashed var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink-2);font-size:11.5px;line-height:1.4}
.stats-heat-card{overflow:hidden}.stats-heat-scroll{margin-top:8px;padding-bottom:3px}.stats-heat-card .hmc{transition:transform .15s ease}.stats-heat-card .hmc:hover{transform:scale(1.13)}
.stats-empty{text-align:center;padding:28px 18px}.stats-empty-mark{width:44px;height:44px;margin:0 auto 10px;display:grid;place-items:center;border-radius:14px;background:var(--panel-2);color:var(--ok);font-size:23px}.stats-empty p{max-width:420px;margin:7px auto 0;color:var(--ink-2);font-size:12.5px;line-height:1.5}
.stats-habit-grid{display:grid;grid-template-columns:1fr;gap:10px}.stats-habit-card{width:100%;text-align:left;color:inherit;cursor:pointer}.stats-habit-top{display:flex;align-items:center;gap:10px}.stats-habit-name{flex:1;min-width:0}.stats-habit-name h2{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats-arrow{font-size:22px;color:var(--ink-3)}.stats-habit-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:11px}.stats-habit-kpis .stats-metric{padding:8px}.stats-habit-kpis .stats-metric b{font-size:15px}.stats-habit-kpis .stats-metric span{font-size:9px}.stats-habit-card .chart{margin-top:7px}.stats-habit-card .stats-delta{margin-top:9px;max-width:100%;white-space:normal}
.stats-time-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.stats-time-head-copy{flex:1;min-width:0}.stats-time-head-copy .sub{margin-top:2px}.stats-time-toggle{flex:none;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:12px;border:1px solid var(--line-soft);background:var(--panel-2);color:var(--ink);box-shadow:none}.stats-time-toggle-copy{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}.stats-time-toggle-copy b{font-size:11px;white-space:nowrap}.stats-time-toggle-copy small{margin-top:3px;font-size:9px;color:var(--ink-3);font-weight:700;white-space:nowrap}.stats-time-toggle i{font-style:normal;font-size:16px;line-height:1;color:var(--ink-2);transition:transform .18s ease,color .18s ease}.stats-time-toggle.on i{transform:rotate(90deg);color:var(--ok)}.stats-time-extra{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)}.stats-time-extra .sub{margin-top:2px}.stats-time-note{margin-top:10px;font-size:10.5px;color:var(--ink-3);line-height:1.45}.stats-time-split{margin-top:12px}.stats-objective-card .objwrap{margin-top:0}.stats-goals-card>.stats-metric-grid{margin-top:0}.stats-goal-list{margin-top:12px}.stats-goal-list .goitem{padding:10px 0}.stats-goal-list small{display:block;margin-top:2px;font-size:10.5px;color:var(--ink-2)}
@keyframes statsRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stats-hero-card,.stats-grid-2>.card,.stats-chart-card,.stats-heat-card,.stats-habit-card{animation:statsRise .28s ease both}
@media (min-width:620px){.stats-metric-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.stats-grid-2{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stats-grid-2>.card{margin-bottom:10px}.stats-habit-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:900px) and (pointer:fine){.stats-period{max-width:420px}.stats-hero-card{padding:22px}.stats-hero-grid{grid-template-columns:150px 1fr}.stats-habit-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats-tabs{top:10px}.stats-weekdays{height:150px}}
@media (prefers-reduced-motion:reduce){.stats-hero-card,.stats-grid-2>.card,.stats-chart-card,.stats-heat-card,.stats-habit-card{animation:none}.stats-rank-track i,.stats-weekday-bar i,.stats-time-toggle i{transition:none}}


/* ---------- tableros / lienzo libre ---------- */

.gtab .r b{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:14px;text-align:right;
  letter-spacing:-.02em;min-width:0;line-height:1.25}
.gtab .r b small{display:block;font-family:"Instrument Sans",sans-serif;font-weight:500;font-size:10.5px;
  color:var(--ink-2);line-height:1.3;margin-top:1px}
.golist{margin-top:10px}
.goitem{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.goitem:last-child{border-bottom:none}
.goitem span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goitem b{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:13px;flex:none}
.tagmeta{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
  padding:2px 7px;border-radius:999px;border:1px solid var(--line-soft);background:var(--panel-2);color:var(--ink-2)}
.pickbox{margin-top:6px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.pickbox .p{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line-soft);
  font-size:13.5px;font-weight:600;color:var(--ink)}
.pickbox .p:last-child{border-bottom:none}
.pickbox .p .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex:none;
  display:grid;place-items:center;font-size:12px;color:#fff}
.pickbox .p.on .ck{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pickbox .p span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickbox .p small{font-weight:500;font-size:11px;color:var(--ink-2);flex:none}
.metadesc{margin-top:5px;font-size:12.5px;color:var(--ink-2);line-height:1.4}
.objwrap{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.objcard{border:1px solid var(--line-soft);border-radius:12px;padding:11px 12px;background:var(--panel-2)}
.objcard .oh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.objcard .oh b{flex:1;min-width:60px;font-family:"Bricolage Grotesque",sans-serif;font-size:13.5px;font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.objcard .opct{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:13px;flex:none}
.objcard .track{margin-top:8px;background:var(--panel)}
.objcard .om{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}
.status{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:999px;flex:none;letter-spacing:.01em}
.status.ok{background:rgba(31,122,77,.14);color:var(--ok)}
.status.warn{background:rgba(224,138,46,.16);color:#E08A2E}
.status.late{background:rgba(210,69,60,.14);color:#D2453C}
.status.muted{background:var(--panel);color:var(--ink-3)}
.projbox{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:9px 10px;border-radius:10px;font-size:12.5px;line-height:1.4}
.projbox i{font-style:normal;flex:none;font-size:14px}
.projbox b{font-weight:700}
.projbox.ok{background:rgba(31,122,77,.10);color:var(--ink)}
.projbox.warn{background:rgba(224,138,46,.12);color:var(--ink)}
.cfwrap{position:fixed;left:0;right:0;top:0;bottom:0;height:100vh;height:100dvh;z-index:90;background:rgba(10,20,26,.55);
  display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .15s ease-out}
.cfbox{background:var(--bg);width:100%;max-width:340px;border-radius:20px;padding:20px 18px 14px;
  box-shadow:0 24px 60px rgba(0,0,0,.4);animation:pop .22s cubic-bezier(.2,1.1,.3,1)}
.cfbox p{font-size:15px;line-height:1.4;font-weight:600;margin:0 0 4px}
.pickbox>:last-child{border-bottom:none}
.pickbox .pwin{padding:8px 11px 11px 40px;border-bottom:1px solid var(--line-soft);background:var(--panel-2)}
.pwin .wr{display:flex;gap:8px}
.pwin .wr label{flex:1;min-width:0;font-size:11px;font-weight:600;color:var(--ink-2)}
.pwin .wr .fld-date{width:100%;margin-top:4px;padding:8px 9px;border-radius:8px;border:1px solid var(--line);font-size:14px;font-weight:500}
.pwin .wh{margin-top:6px;font-size:11px;line-height:1.35;color:var(--ink-2);font-weight:500}
.pwin .wt{font-size:11.5px;font-weight:700;color:var(--ink);margin-bottom:6px}
.winbox{margin-bottom:12px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.winbox .wt{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:8px}
.winbox .wr{display:flex;gap:8px}
.winbox .wr label{flex:1;min-width:0;font-size:11px;font-weight:600;color:var(--ink-2)}
.winbox .wr .fld-date{width:100%;margin-top:4px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);font-size:15px;font-weight:500}
.winbox .wh{margin-top:7px;font-size:11px;line-height:1.35;color:var(--ink-2);font-weight:500}
.addobj{margin-top:10px;width:100%;border:1.5px dashed var(--line);border-radius:10px;padding:9px;
  background:transparent;color:var(--ink-2);font-weight:700;font-size:12.5px}
textarea.tf{width:100%;margin-top:5px;padding:10px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel);font-size:15px;font-weight:500;font-family:inherit;resize:vertical}

/* ---------- cumplimiento ---------- */
.yearbar{display:flex;align-items:center;gap:8px;margin:10px 0 4px}
.yearbar .y{flex:1;text-align:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px}
.cmp{margin-top:4px}
.cmp .r{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.cmp .r:last-child{border-bottom:none}
.cmp .r.now .mn{color:var(--ink)}
.cmp .mn{width:74px;flex:none;font-size:13px;font-weight:600;color:var(--ink-2)}
.cmp .tk{flex:1;height:8px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line-soft);overflow:hidden}
.cmp .tk i{display:block;height:100%;border-radius:5px}
.cmp .pv{width:46px;flex:none;text-align:right;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:14px}
.cmp .pv.na{color:var(--ink-3);font-weight:500}

/* ---------- gráfico de línea ---------- */
.chart{margin-top:10px}
.chart svg{width:100%;display:block;overflow:hidden}
.chart .gl{stroke:var(--line-soft);stroke-width:1}
.chart .gt{fill:var(--ink-3);font-size:8px;font-family:"Instrument Sans",sans-serif}
.chart .xl{fill:var(--ink-3);font-size:8px;font-family:"Instrument Sans",sans-serif;text-anchor:middle}
.verdict{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft);font-size:13px}
.verdict b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;letter-spacing:-.02em}

/* ---------- rachas ---------- */
.streak{display:flex;gap:9px;margin-top:11px}
.stbox{flex:1;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:9px;padding:9px 10px;min-width:0}
.stbox em{font-style:normal;display:block;font-size:10.5px;color:var(--ink-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stbox b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;letter-spacing:-.03em;line-height:1.15}
.stbox small{display:block;font-size:10px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dates{display:flex;gap:9px;margin-top:9px}
.dates div{flex:1;font-size:11.5px;color:var(--ink-2);min-width:0}
.dates div b{display:block;color:var(--ink);font-weight:600;font-size:12.5px}

/* ---------- análisis ---------- */
.anal{margin-top:8px}
.anal .l{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;line-height:1.35}
.anal .l:last-child{border-bottom:none}
.anal .l i{font-style:normal;flex:none;font-size:14px;width:19px;text-align:center}
.anal .l b{font-weight:700}
.up{color:var(--ok)}
.down{color:#D2453C}
.sectionhead{margin:22px 3px 9px}
.sectionhead h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);font-weight:800}
.sectionhead:first-child{margin-top:2px}

/* ---------- calendario ---------- */
.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 6px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.statsseg button{font-size:11.5px;line-height:1.15;padding:8px 3px}
.statsseg button:first-child{flex:1.35}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:4px}
.calgrid .dn{text-align:center;font-size:10px;font-weight:700;color:var(--ink-3);padding-bottom:2px}
.cday{aspect-ratio:1/1.05;border-radius:8px;border:1px solid var(--line-soft);background:var(--panel-2);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 2px 2px;gap:2px;position:relative}
.cday .d{font-size:12.5px;font-weight:600;font-family:"Bricolage Grotesque",sans-serif;line-height:1}
.cday.out{opacity:.35}
.cday.today{border-color:#D8453B}
.cday.today .d{color:#fff;background:#D8453B;border-radius:5px;padding:1px 4px}
.cday.sel{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink) inset}
.cday .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cday .dots i{width:5px;height:5px;border-radius:50%;display:block}
.cday .ring{position:absolute;left:3px;bottom:3px;right:3px;height:3px;border-radius:2px;background:var(--line-soft);overflow:hidden}
.cday .ring u{display:block;height:100%;background:var(--ok)}
.evlist{margin-top:10px}
.ev{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.ev:last-child{border-bottom:none}
.ev .bar{width:4px;align-self:stretch;border-radius:3px;flex:none;min-height:30px}
.ev .tm{font-size:11.5px;color:var(--ink-2);font-weight:700;width:46px;flex:none;font-family:"Bricolage Grotesque",sans-serif}
.ev .tx{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.25}
.ev .tx small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-2)}
.ev .dd{font-size:11px;color:var(--ink-3);flex:none}

/* ---------- heatmap ---------- */
.hmwrap{margin-top:6px}
.hmmonths{display:flex;font-size:9.5px;color:var(--ink-3);font-weight:600;margin-bottom:3px;min-width:max-content}
.hm{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;min-width:max-content}
.hmc{width:12px;height:12px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line-soft)}
.hmc.l1{background:rgba(46,158,99,.30);border-color:transparent}
.hmc.l2{background:rgba(46,158,99,.52);border-color:transparent}
.hmc.l3{background:rgba(46,158,99,.76);border-color:transparent}
.hmc.l4{background:#2E9E63;border-color:transparent}
.hmc.emptyc{background:transparent;border-color:transparent}
.hmc.fut{opacity:.35}
.hmleg{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:9px;font-size:10.5px;color:var(--ink-3)}
.hmleg .hmc{width:11px;height:11px}

/* ---------- trabajo ---------- */
.wday{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.wday:last-child{border-bottom:none}
.wday .dn2{width:74px;flex:none;font-size:12.5px;font-weight:700}
.wday .dn2 small{display:block;font-weight:500;font-size:10.5px;color:var(--ink-3)}
.wday .rg{flex:1;min-width:0;font-size:12.5px;color:var(--ink-2)}
.wday .hh{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:14px;flex:none}
.wday.off .hh{color:var(--ink-3);font-weight:500}
.tapzone{border:1.5px dashed var(--line);border-radius:10px;padding:13px;text-align:center;
  margin-top:10px;color:var(--ink-2);font-size:13px;font-weight:600;background:var(--panel-2)}
.tapzone:active{background:var(--panel)}
.wrow{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.wrow .wd{width:30px;flex:none;font-weight:700;font-size:12px}
.wrow input.fld-time,.wrow input[type=number]{flex:1;min-width:0;padding:8px 5px;border-radius:8px;
  border:1px solid var(--line);background:var(--panel);font-size:14px;font-weight:500;text-align:center}
.wrow input[type=number]{max-width:58px;flex:none}
.wrow .eq{color:var(--ink-3);font-size:11px;flex:none}
.qgrid{display:flex;gap:9px;margin-top:10px}
.qbox{flex:1;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:11px;min-width:0}
.qbox em{font-style:normal;display:block;font-size:11px;color:var(--ink-2);font-weight:600}
.qbox b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;letter-spacing:-.03em;line-height:1.2}
.qbox small{display:block;font-size:10px;color:var(--ink-3)}
.totrow{display:flex;align-items:baseline;justify-content:space-between;margin-top:12px;padding-top:11px;
  border-top:1px solid var(--line)}
.totrow span{font-size:12.5px;color:var(--ink-2);font-weight:600}
.totrow b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;letter-spacing:-.03em}

/* ---------- notas ---------- */
.notegrid{columns:2;column-gap:10px;margin-top:10px}
.note{break-inside:avoid;-webkit-column-break-inside:avoid;display:inline-block;width:100%;
  border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:10px;background:var(--panel)}
.note h3{font-size:14px;line-height:1.2;margin-bottom:4px;font-family:"Bricolage Grotesque",sans-serif}
.note p{margin:0;font-size:12.5px;color:var(--ink-2);white-space:pre-wrap;line-height:1.38;
  max-height:170px;overflow:hidden}
.note.solid h3,.note.solid p,.note.solid .nf{color:inherit}
.note.solid p{opacity:.92}
.note.solid .nf{opacity:.75}
.note .nf{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:10px;color:var(--ink-3)}
.note .nf .pn{margin-left:auto;font-size:12px}
label.f textarea.note-ta{font-family:"Instrument Sans",sans-serif;font-size:15px;min-height:150px}

/* ---------- mascota caminando ---------- */
.toto-lane{position:fixed;left:0;right:0;bottom:54px;height:56px;
  pointer-events:none;z-index:35;overflow:visible;transition:opacity .2s}
.toto-lane.off{display:none}
.toto-inner{max-width:900px;margin:0 auto;position:relative;height:100%}
.toto-walker{position:absolute;bottom:2px;left:4%;
  animation:totoMoveL 15s ease-in-out infinite;transform-origin:50% 100%}
.toto-walker.face-left{animation-name:totoMoveL}
.toto-walker.face-right{animation-name:totoMoveR}
.toto-shadow{width:30px;height:7px;border-radius:50%;background:rgba(20,36,45,.16);
  margin:0 auto;animation:totoShadow .7s ease-in-out infinite}
.toto-bounce{animation:totoBounce .7s ease-in-out infinite}
.toto-sprite{background-repeat:no-repeat;
  image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges}
@keyframes totoBounce{0%,100%{transform:translateY(0)}25%{transform:translateY(-3px)}50%{transform:translateY(0)}75%{transform:translateY(-3px)}}
@keyframes totoShadow{0%,100%{transform:scale(1)}25%{transform:scale(.78)}50%{transform:scale(1)}75%{transform:scale(.78)}}
/* Camina de izquierda a derecha y vuelve. Movimiento y giro van en la MISMA animación
   (así el sprite siempre mira hacia donde camina). Gira en la pausa de cada extremo.
   totoMoveL: el sprite original mira a la izquierda · totoMoveR: el sprite original mira a la derecha */
@keyframes totoMoveL{
  0%{left:4%;transform:scaleX(-1)}
  46%{left:76%;transform:scaleX(-1)}
  48%{left:76%;transform:scaleX(-1)}
  48.01%{left:76%;transform:scaleX(1)}
  50%{left:76%;transform:scaleX(1)}
  96%{left:4%;transform:scaleX(1)}
  98%{left:4%;transform:scaleX(1)}
  98.01%{left:4%;transform:scaleX(-1)}
  100%{left:4%;transform:scaleX(-1)}
}
@keyframes totoMoveR{
  0%{left:4%;transform:scaleX(1)}
  46%{left:76%;transform:scaleX(1)}
  48%{left:76%;transform:scaleX(1)}
  48.01%{left:76%;transform:scaleX(-1)}
  50%{left:76%;transform:scaleX(-1)}
  96%{left:4%;transform:scaleX(-1)}
  98%{left:4%;transform:scaleX(-1)}
  98.01%{left:4%;transform:scaleX(1)}
  100%{left:4%;transform:scaleX(1)}
}
@media (prefers-reduced-motion:reduce){
  .toto-walker,.toto-bounce,.toto-sprite,.toto-shadow{animation:none}
}

/* ---------- selector de mascotas ---------- */
.petgrid{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.petopt{display:flex;align-items:center;gap:12px;padding:11px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--panel)}
.petopt.on{border-color:var(--ink);background:var(--panel-2)}
.petprev{width:56px;height:56px;border-radius:10px;background:var(--panel-2);flex:none;
  display:grid;place-items:center;overflow:hidden;border:1px solid var(--line-soft)}
.petopt.on .petprev{background:var(--bg)}
.petprev i{display:block;image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges}
.petprev.none{font-size:22px;color:var(--ink-3)}
.petinfo{flex:1;min-width:0}
.petinfo b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:14.5px;font-weight:700}
.petinfo span{display:block;font-size:11.5px;color:var(--ink-2);margin-top:1px}
.petck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none;
  display:grid;place-items:center;font-size:12px;color:#fff}
.petopt.on .petck{background:var(--ink);border-color:var(--ink)}

/* ---------- skin de barra (fondo por donde caminan las mascotas) ---------- */
#barSkin{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;pointer-events:none;
  background-repeat:repeat-x,no-repeat;background-position:center top,left bottom;
  image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges}
body.barskin #barSkin{display:block}
body.barskin nav#tabs{border-top:none;
  background:linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 6px,rgba(0,0,0,.34) 24px)}
body.barskin nav#tabs button{color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.85),0 0 4px rgba(0,0,0,.55)}
body.barskin nav#tabs button.on{color:#FFFF55;background:rgba(0,0,0,.30);border-radius:8px 8px 0 0}
body.barskin .toto-walker{bottom:-3px}
.petprev.skinprev{padding:0}
.petprev.skinprev i{width:100%;height:100%}
.petsoon{display:flex;align-items:center;gap:12px;padding:11px;border-radius:12px;
  border:1.5px dashed var(--line);color:var(--ink-3);font-size:12.5px}
.hidden{display:none !important}
.desktop-brand{display:none}

/* ---------- franja temática (batman / spiderman) ---------- */
.theme-banner{display:none;overflow:hidden;white-space:nowrap;
  font-size:14px;line-height:1;letter-spacing:8px;padding:6px 0;
  text-align:center;user-select:none;pointer-events:none}
:root[data-theme="batman"] .theme-banner{
  display:block;background:#000;color:#F2C230;
  border-bottom:1px solid #2B2B31}
:root[data-theme="spiderman"] .theme-banner{
  display:block;background:linear-gradient(90deg,#C8102E,#0D3B8C);
  color:#0B1230;text-shadow:0 1px 0 rgba(255,255,255,.25);
  border-bottom:1px solid #0A1444}
.archive-tabs{display:flex;gap:8px;margin-bottom:16px}
.archive-tabs .btn{flex:1;margin:0;min-height:44px}
.archive-filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:16px}
.archive-filters input,.archive-filters select{min-width:0;width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;font-size:14px}
.archive-card{display:block;width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.archive-card:hover{border-color:var(--ok)}
.archive-card:focus-visible,.archive-day:focus-visible{outline:2px solid var(--ok);outline-offset:3px}
.archive-badge{font-size:10px;padding:5px 7px;border-radius:6px;background:var(--panel-2);color:var(--ok)}
.archive-summary{margin:14px 0 6px;font-size:14px;font-weight:700}
.archive-info{display:flex;gap:14px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px;overflow-wrap:anywhere}
.archive-info b{text-align:right;font-weight:600;max-width:65%}
.archive-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.archive-kpis .kpi{min-width:0}
.archive-month-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}
.archive-month-nav .btn{width:44px;min-height:44px;margin:0}
.archive-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.archive-weekday{text-align:center;font-size:11px;color:var(--ink-2);padding-bottom:6px}
.archive-day{min-height:40px;aspect-ratio:1.15;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
.archive-full{background:#235c40;color:#e6fff0}
.archive-partial{background:#614d1d;color:#fff0b8}
.archive-missed{background:#5c2b2b;color:#ffdbdb}
.archive-none{background:var(--panel-2);color:var(--ink-2)}
.archive-outside{background:transparent;color:var(--ink-3);opacity:.35;cursor:default}
.archive-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.archive-legend span{font-size:10px;border-radius:5px;padding:5px 7px}
.archive-day-info{margin-top:12px;font-size:13px}
.archive-comparison{display:flex;height:12px;gap:3px;border-radius:8px;overflow:hidden;margin-top:14px}
.archive-chart{width:100%;height:auto;margin-top:12px;border-bottom:1px solid var(--line)}
.archive-observations{max-height:240px;overflow:auto}
@media(max-width:560px){.archive-filters{grid-template-columns:1fr 1fr}.archive-filters input{grid-column:1/-1}.archive-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.archive-badge{display:none}}

</div></div></div>

<script>
/* ============================ datos ============================ */
const COLORS=["#E2574C","#E08A2E","#C9A227","#3F9E63","#2C8CB4","#5468D4","#8E56CC","#D1477E"];
const DAYN=["L","M","M","J","V","S","D"];       // lunes = 0
const DAYFULL=["lunes","martes","miércoles","jueves","viernes","sábado","domingo"];
const MONTHS=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const KEY="ficha-habitos-v1";

let state={habits:[],goals:[],objectives:[],events:[],notes:[],boards:[],work:{},log:{},settings:{labelsRight:true,mascot:"totodile",barSkin:"none",theme:"dark",bgImage:null,bgBrightness:100,bgBlur:0},updatedAt:0};
let tab="hoy";
let cursor=new Date();      // fecha de referencia de la vista

/* ------------ fechas ------------ */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromIso=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dow=d=>(d.getDay()+6)%7;                    // 0 = lunes
const startWeek=d=>addDays(d,-dow(d));
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const isFuture=s=>fromIso(s)>today();
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ------------ horas ------------ */
function detectTarget(name){
  let m=name.match(/(\d+(?:[.,]\d+)?)\s*(?:h|hs|hr|hrs|horas?)\b/i);
  if(m) return parseFloat(m[1].replace(",","."));
  m=name.match(/(\d+(?:[.,]\d+)?)\s*(?:m|min|mins|minutos?)\b/i);
  if(m) return parseFloat(m[1].replace(",","."))/60;
  return null;
}
function fmtH(h){
  if(!h) return "0";
  const t=Math.round(h*60), H=Math.floor(t/60), M=t%60;
  if(H&&M) return H+" h "+M+" m";
  if(H) return H+" h";
  return M+" m";
}

/* ------------ helpers de estado ------------ */
const habitsOf=()=>state.habits.filter(h=>!h.archived);
const key=(id,d)=>id+"|"+d;
function val(h,d){return state.log[key(h.id,d)]||0}
function applies(h,d){        // ¿toca este día? (cualquier fecha es editable)
  const dt=fromIso(d);
  return !(h.days && !h.days.includes(dow(dt)));
}
function score(h,d){                    // 0..1
  const v=val(h,d);
  if(h.type==="hours") return Math.max(0,Math.min(1,v/(h.target||1)));
  return v?1:0;
}
function done(h,d){return score(h,d)>=0.999}

// un dia cuenta si ya paso, o si es futuro pero ya lo marcaste
function counts(h,d){
  if(!applies(h,d)) return false;
  if(h.since && d<h.since) return false;      // antes de empezar no resta
  return !isFuture(d) || val(h,d)>0;          // el futuro cuenta si ya lo cargaste
}
// dias en los que cumpliste TODO lo que tocaba
function perfectDays(days){
  let n=0;
  for(const d of days){
    const hs=habitsOf().filter(h=>counts(h,d));
    if(hs.length&&hs.every(h=>done(h,d))) n++;
  }
  return n;
}
function rangeStats(hs,days){
  let tot=0,sum=0,hours=0,fullDays=0;
  for(const h of hs){
    for(const d of days){
      if(h.type==="hours") hours+=val(h,d);
      if(!counts(h,d)) continue;
      tot++; const s=score(h,d); sum+=s; if(s>=.999) fullDays++;
    }
  }
  return {pct:tot?Math.round(sum/tot*100):0,tot,fullDays,hours,sum};
}
function habitStats(h,days){
  let tot=0,sum=0,hours=0,full=0;
  for(const d of days){
    if(h.type==="hours") hours+=val(h,d);
    if(!counts(h,d)) continue;
    tot++; const s=score(h,d); sum+=s; if(s>=.999) full++;
  }
  return {pct:tot?Math.round(sum/tot*100):0,tot,full,hours};
}
/* ------------ metas / objetivos ------------
   META      -> resultado grande. nombre + descripción opcional + fecha
                límite opcional. No se mide directo: es el promedio de
                sus objetivos.
   OBJETIVO  -> resultado concreto y medible que pertenece a una meta
                (objective.goalId). Tiene su propio valor objetivo, fecha
                límite, tipo de progreso y agrupa uno o varios hábitos
                (habit.objectiveId).
   HÁBITO    -> se relaciona con un objetivo. Por compatibilidad, un hábito
                viejo puede seguir apuntando directo a una meta con
                habit.goalId; habitGoalId() resuelve el vínculo efectivo
                ya sea directo o a través de su objetivo. */
const allGoals=()=>(state.goals||[]);
const goalsOf=()=>allGoals().filter(g=>!g.archived);
const goalById=id=>allGoals().find(g=>g.id===id)||null;
const objectivesOf=()=>(state.objectives||[]).filter(o=>!goalById(o.goalId)?.archived);
const objectiveById=id=>(state.objectives||[]).find(o=>o.id===id)||null;
const goalObjectives=g=>objectivesOf().filter(o=>!o.archived&&o.goalId===g.id);
const objectiveHabits=o=>state.habits.filter(h=>!h.archived&&h.objectiveId===o.id);
function habitGoalId(h){
  if(h.objectiveId){const o=objectiveById(h.objectiveId);if(o&&o.goalId) return o.goalId;}
  if(h.goalId) return h.goalId;      // hábito viejo aún sin migrar, colgado directo de una meta
  return null;
}
// hábitos de una meta: los de todos sus objetivos + los que aún cuelgan directo (dato viejo)
const goalHabits=g=>state.habits.filter(h=>!h.archived&&habitGoalId(h)===g.id);
/* Archivo de metas v1: cada snapshot contiene únicamente datos independientes del estado vivo. */
let goalsTab="active", archiveQuery="", archiveOrder="newest", archiveYear="", archiveDetail=null, archiveStats=false, archiveMonth="";
const archiveClone=x=>JSON.parse(JSON.stringify(x));
const validGoalDate=s=>typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&iso(fromIso(s))===s;
const archivedGoals=()=>allGoals().filter(g=>g.archived);
function inferredGoalStart(g){
  if(validGoalDate(g.startDate))return g.startDate;
  const os=(state.objectives||[]).filter(o=>o.goalId===g.id);
  const hs=state.habits.filter(h=>habitGoalId(h)===g.id);
  const ids=new Set(hs.map(h=>h.id));
  const dates=[g.since,...os.map(o=>o.since),...hs.flatMap(h=>[h.since,h.objFrom]),
    ...Object.keys(state.log).filter(k=>ids.has(k.split("|")[0])).map(k=>k.split("|")[1])].filter(validGoalDate).sort();
  return dates[0]||(g.createdAt?iso(new Date(g.createdAt)):iso(today()));
}
function migrateGoalArchives(){
  let changed=false;
  allGoals().forEach(g=>{
    if(typeof g.archived!=="boolean"){g.archived=false;changed=true}
    if(!Object.prototype.hasOwnProperty.call(g,"createdAt")){g.createdAt=null;changed=true}
    if(!validGoalDate(g.startDate)){g.startDate=inferredGoalStart(g);g.startDateInferred=true;changed=true}
    if(!Array.isArray(g.progressHistory)){g.progressHistory=[];changed=true}
    if(g.archiveSnapshot&&g.archiveSnapshot.historyVersion!==2){
      g.archiveSnapshot=rebuildArchiveHistory(g.archiveSnapshot);changed=true;
    }
  });
  if(state.goalArchiveVersion!==2){state.goalArchiveVersion=2;changed=true}
  return changed;
}
// Observaciones reales, desde esta actualización. No inventamos la evolución manual anterior.
function recordGoalProgress(){
  goalsOf().forEach(g=>{
    const pct=goalStats(g).pct;
    if(!Array.isArray(g.progressHistory))g.progressHistory=[];
    const last=g.progressHistory[g.progressHistory.length-1];
    if(!last||last.pct!==pct)g.progressHistory.push({at:new Date().toISOString(),date:iso(today()),pct});
  });
}
// Reconstruye únicamente desde la fotografía guardada, nunca desde los hábitos activos.
// Incluye marcas anticipadas y anteriores al inicio sin inventar faltas futuras.
function rebuildArchiveHistory(s){
  const habits=s.habits||[], log=s.log||{}, rows=s.objectives||[];
  const objectives=rows.map(r=>r.objective);
  const habitIds=new Set(habits.map(h=>h.id));
  const recordedDates=Object.entries(log).filter(([k,v])=>habitIds.has(k.split("|")[0])&&Number(v)>0)
    .map(([k])=>k.split("|")[1]).filter(validGoalDate);
  const completedByDate=new Map();
  objectives.forEach(o=>{
    const date=typeof o.completedAt==="string"?o.completedAt.slice(0,10):"";
    if(o.completed&&validGoalDate(date)){
      if(!completedByDate.has(date))completedByDate.set(date,[]);
      completedByDate.get(date).push({id:o.id,name:o.name});recordedDates.push(date);
    }
  });
  const activityStartDate=s.activityStartDate||s.startDate;
  const activityEndDate=s.activityEndDate||s.endDate;
  const starts=[activityStartDate,...recordedDates].filter(validGoalDate).sort();
  const ends=[activityEndDate,...recordedDates].filter(validGoalDate).sort();
  const startDate=starts[0]||s.startDate,endDate=ends[ends.length-1]||s.endDate;
  const daily=[];let streak=0,maxStreak=0,totalScore=0,totalExpected=0;
  const value=(h,date)=>Number(log[key(h.id,date)])||0;
  for(let dt=fromIso(startDate);iso(dt)<=endDate;dt=addDays(dt,1)){
    const date=iso(dt);
    const scheduled=habits.filter(h=>{
      // El intervalo original determina faltas; las marcas fuera de él cuentan por sí mismas.
      if(date<activityStartDate||date>activityEndDate||date>s.archivedDate||h.archived||!applies(h,date))return false;
      const o=objectives.find(x=>x.id===h.objectiveId);
      if(o&&(o.archived||o.mode==="manual"))return false;
      if(hasWin(h))return inWin(h,date);
      return (!h.since||date>=h.since)&&(!o||((!o.since||date>=o.since)&&(!o.deadline||date<=o.deadline)));
    });
    const participants=habits.filter(h=>scheduled.includes(h)||value(h,date)>0);
    const values=participants.map(h=>{const v=value(h,date);return {
      habitId:h.id,value:v,score:h.type==="hours"?Math.max(0,Math.min(1,v/(h.target||1))):v>0?1:0,
      scheduled:scheduled.includes(h)
    }});
    const completedObjectives=completedByDate.get(date)||[];
    const habitSum=values.reduce((n,x)=>n+x.score,0);
    const sum=habitSum+completedObjectives.length,expected=values.length+completedObjectives.length;
    const status=!expected?"none":sum>=expected*.999?"full":sum>0?"partial":"missed";
    if(status==="full"){streak++;maxStreak=Math.max(maxStreak,streak)}
    else if(status!=="none")streak=0;
    totalScore+=habitSum;totalExpected+=values.length;
    daily.push({date,status,expected,values,completedObjectives,pct:expected?Math.round(sum/expected*100):null,
      cumulativePct:totalExpected?Math.round(totalScore/totalExpected*100):null});
  }
  const counts={full:0,partial:0,missed:0,none:0};daily.forEach(d=>counts[d.status]++);
  return {...s,historyVersion:2,activityStartDate,activityEndDate,startDate,endDate,daily,counts,maxStreak,
    average:totalExpected?Math.round(totalScore/totalExpected*100):null};
}

function createGoalSnapshot(g){
  const archivedAt=new Date().toISOString(), archivedDate=iso(today());
  const objectives=(state.objectives||[]).filter(o=>o.goalId===g.id);
  const habits=state.habits.filter(h=>habitGoalId(h)===g.id);
  const ids=new Set(habits.map(h=>h.id)), oids=new Set(objectives.map(o=>o.id));
  const log=Object.fromEntries(Object.entries(state.log).filter(([k])=>ids.has(k.split("|")[0])));
  const related=x=>x.goalId===g.id||oids.has(x.objectiveId)||ids.has(x.habitId)||
    (Array.isArray(x.goalIds)&&x.goalIds.includes(g.id));
  const stats=goalStats(g), startDate=inferredGoalStart(g);
  const endDate=g.deadline&&g.deadline<archivedDate?g.deadline:archivedDate;
  const rows=objectives.map(o=>({objective:archiveClone(o),stats:archiveClone(objectiveStats(o)),included:!o.archived}));
  const goal=archiveClone(g);delete goal.archiveSnapshot;delete goal.lastArchiveSnapshot;
  return rebuildArchiveHistory(archiveClone({version:1,archivedAt,archivedDate,goal,startDate,endDate,
    finalProgress:stats.pct,total:stats.total,doneCount:stats.doneCount,objectives:rows,habits,log,
    notes:state.notes.filter(related),events:state.events.filter(related),
    progressHistory:g.progressHistory||[],
    habitStats:habits.map(h=>({id:h.id,streak:streakInfo(h)}))}));
}
// Si el dispositivo no permite guardar, la operación se revierte en memoria.
function commitGoalArchive(change){
  const previous=archiveClone(state);
  try{
    change();state.updatedAt=Date.now();
    if(!persist()){state=previous;toast("No se guardó el cambio. Liberá espacio o exportá un respaldo y volvé a intentar.");return false}
    flashSaved();return true;
  }catch(e){state=previous;toast("No se pudo guardar el cambio. Tus datos siguen intactos.");return false}
}
function archiveGoal(id){
  const g=goalById(id);if(!g||g.archived)return false;
  return commitGoalArchive(()=>{
    recordGoalProgress();
    const snapshot=createGoalSnapshot(g);
    g.archiveSnapshot=snapshot;g.archivedAt=snapshot.archivedAt;
    g.finalProgress=snapshot.finalProgress;g.archived=true;
  });
}
function restoreGoal(id){
  const g=goalById(id);if(!g||!g.archived)return false;
  return commitGoalArchive(()=>{
    g.archived=false;g.lastArchivedAt=g.archivedAt;g.archivedAt=null;g.finalProgress=null;
    g.restoredAt=new Date().toISOString();
    // Se conservan fechas, objetivos y asociaciones actuales; nunca pisamos hábitos compartidos.
    recordGoalProgress();
  });
}
function deleteArchivedGoal(id){
  const g=goalById(id);if(!g||!g.archived)return false;
  return commitGoalArchive(()=>{
    state.goals=allGoals().filter(x=>x.id!==id);
    state.objectives.forEach(o=>{if(o.goalId===id)o.goalId=null});
    state.habits.forEach(h=>{if(h.goalId===id)delete h.goalId});
  });
}
function requestArchiveGoal(g){
  askConfirm("¿Archivar la meta “"+g.name+"”? Dejará de aparecer como activa. Sus datos no se perderán y podrás consultarlos en Metas archivadas.",()=>{
    if(!archiveGoal(g.id))return;
    closeModal();goalsTab="archived";archiveDetail=null;tab="metas";render();toast("Meta archivada");
  },"Archivar");
}
function archiveButton(label,action,cls="sec"){
  const b=el("button","btn "+cls,label);b.type="button";b.onclick=action;return b;
}
function showArchivedGoal(g,stats=false){
  closeModal();goalsTab="archived";archiveDetail=g.id;archiveStats=stats;
  archiveMonth=(g.archiveSnapshot?.startDate||iso(today())).slice(0,7);
  tab="metas";window.scrollTo(0,0);render();
}
function goalArchiveNavigation(){
  const tabs=el("div","archive-tabs");tabs.setAttribute("aria-label","Vistas de metas");
  [["active","Activas",goalsOf().length],["archived","Metas archivadas",archivedGoals().length]].forEach(([id,label,n])=>{
    const b=archiveButton(label+" · "+n,()=>{goalsTab=id;archiveDetail=null;render()},goalsTab===id?"pri":"sec");
    b.setAttribute("aria-pressed",String(goalsTab===id));tabs.appendChild(b);
  });view.appendChild(tabs);
}
function archiveDate(s){return validGoalDate(s)?fmtDate(s):"No registrada"}
function archiveCard(g){
  const s=g.archiveSnapshot;
  const c=el("button","card archive-card");c.type="button";c.onclick=()=>showArchivedGoal(g);
  const hd=el("div","goalhead");hd.appendChild(donut(s?s.finalProgress:0,g.color,66));
  const nm=el("div","nm");nm.appendChild(el("h2","",s?s.goal.name:g.name));
  nm.appendChild(el("div","sub",s?(s.startDate>s.endDate?"Inicio previsto: "+archiveDate(s.startDate):archiveDate(s.startDate)+" — "+archiveDate(s.endDate)):"Sin fotografía histórica"));
  hd.append(nm,el("span","archive-badge","Archivada"));c.appendChild(hd);
  if(s)c.appendChild(el("div","archive-summary",s.finalProgress+"% completado · "+s.doneCount+" / "+s.total+" objetivos"));
  if(s)c.appendChild(el("div","sub","Archivada el "+archiveDate(s.archivedDate)+(s.finalProgress>=100?" · Cumplida":" · Cierre parcial")));
  return c;
}
function viewArchivedGoals(){
  const g=archiveDetail?goalById(archiveDetail):null;
  if(g&&g.archived){viewArchivedGoal(g);return}
  const controls=el("div","archive-filters");
  const search=el("input");search.type="search";search.placeholder="Buscar por nombre";search.value=archiveQuery;search.setAttribute("aria-label","Buscar metas archivadas");
  const order=el("select");order.setAttribute("aria-label","Orden del historial");
  [["newest","Más recientes"],["oldest","Más antiguas"]].forEach(([v,t])=>{const o=el("option","",t);o.value=v;order.appendChild(o)});order.value=archiveOrder;
  const year=el("select");year.setAttribute("aria-label","Año de archivado");
  const any=el("option","","Todos los años");any.value="";year.appendChild(any);
  [...new Set(archivedGoals().map(g=>(g.archiveSnapshot?.archivedDate||g.archivedAt||"").slice(0,4)).filter(Boolean))].sort().reverse().forEach(y=>{const o=el("option","",y);o.value=y;year.appendChild(o)});year.value=archiveYear;
  controls.append(search,order,year);view.appendChild(controls);
  const list=el("div");list.setAttribute("aria-live","polite");view.appendChild(list);
  function paint(){
    list.replaceChildren();
    const gs=archivedGoals().filter(g=>(g.archiveSnapshot?.goal.name||g.name).toLocaleLowerCase().includes(archiveQuery.toLocaleLowerCase())&&
      (!archiveYear||(g.archiveSnapshot?.archivedDate||g.archivedAt||"").startsWith(archiveYear)))
      .sort((a,b)=>(archiveOrder==="newest"?-1:1)*String(a.archivedAt||"").localeCompare(String(b.archivedAt||"")));
    if(!gs.length){const c=el("div","card empty");c.append(el("h2","",archivedGoals().length?"Sin coincidencias":"Todavía no hay metas archivadas"),el("p","","Podés archivar una meta en cualquier momento desde su tarjeta."));list.appendChild(c)}
    gs.forEach(g=>list.appendChild(archiveCard(g)));
  }
  search.oninput=()=>{archiveQuery=search.value;paint()};order.onchange=()=>{archiveOrder=order.value;paint()};year.onchange=()=>{archiveYear=year.value;paint()};paint();
}
function archiveInfoRow(parent,label,value){
  const r=el("div","archive-info");r.append(el("span","sub",label),el("b","",String(value)));parent.appendChild(r);
}
function viewArchivedGoal(g){
  view.appendChild(archiveButton(archiveStats?"‹ Volver a la meta":"‹ Volver al archivo",()=>{if(archiveStats)archiveStats=false;else archiveDetail=null;render()}));
  const s=g.archiveSnapshot;
  if(!s){const c=el("div","card");c.appendChild(el("p","","Esta meta no tiene una fotografía histórica guardada. Podés restaurarla para consultarla sin inventar estadísticas."));view.appendChild(c);archiveActions(g);return}
  const head=el("div","card");

function daysRange(a,b){
  const out=[];let d=fromIso(a);const e=fromIso(b);let guard=0;
  while(d<=e&&guard++<1500){out.push(iso(d));d=addDays(d,1)}
  return out;
}
/* período de cumplimiento de un hábito DENTRO de un objetivo:
   h.objFrom / h.objTo (YYYY-MM-DD). Si están, ese hábito debe cumplirse
   todos los días de ese rango para dejar al objetivo al 100%. */
const hasWin=h=>!!(h&&h.objFrom&&h.objTo&&h.objFrom<=h.objTo);
const inWin=(h,d)=>d>=h.objFrom&&d<=h.objTo;
function countsIn(h,d){
  if(!hasWin(h)) return counts(h,d);
  return applies(h,d)&&inWin(h,d)&&(!isFuture(d)||val(h,d)>0);
}
const dm=s=>s.slice(8,10)+"/"+s.slice(5,7);
function perfectDaysOf(hs,days){
  let n=0;
  for(const d of days){
    const act=hs.filter(h=>countsIn(h,d));
    if(act.length&&act.every(h=>done(h,d))) n++;
  }
  return n;
}
/* progreso de un OBJETIVO (se calcula solo con sus propios hábitos):
   auto -> % promedio de cumplimiento de sus hábitos (objetivo = 100%)
   sum  -> suma acumulada de lo cargado día a día en sus hábitos, en
           la unidad que definas (km, páginas, horas...)
   days -> días en los que cumpliste TODOS los hábitos del objetivo   */
function nodeStats(hs,node){
  const t=iso(today());
  // objetivo MANUAL: no depende de hábitos, lo marcás vos como cumplido
  if(node.mode==="manual"){
    const dn=!!node.completed;
    let daysLeft=null,late=false;
    if(node.deadline){
      daysLeft=Math.round((fromIso(node.deadline)-today())/86400000);
      late=daysLeft<0&&!dn;
    }
    return {hs:[],cur:dn?1:0,target:1,pct:dn?100:0,daysLeft,weekly:null,daily:null,late,
      pace:null,paceDaily:null,paceDays:0,st:{pct:0,tot:0,fullDays:0,hours:0,sum:0},
      daysNow:[],daysAll:[],rest:dn?0:1,effDeadline:node.deadline||null,win:null};
  }
  const start=node.since||t;
  const endNow=(node.deadline&&node.deadline<t)?node.deadline:t;         // hasta hoy (o hasta el cierre)
  const daysNow=start<=endNow?daysRange(start,endNow):[];
  const endAll=(node.deadline&&node.deadline>t)?node.deadline:endNow;    // incluye futuro ya cargado
  const daysAll=start<=endAll?daysRange(start,endAll):[];
  const st=rangeStats(hs,daysNow);
  let cur=0,target=node.target||0,win=null;
  if(node.mode==="sum"){
    hs.forEach(h=>{
      const ds=hasWin(h)?daysRange(h.objFrom,h.objTo):daysAll;
      ds.forEach(d=>{cur+=val(h,d)});
    });
  }
  else if(node.mode==="days"){
    let ds=daysAll;
    if(hs.some(hasWin)){
      const set=new Set(daysAll);
      hs.filter(hasWin).forEach(h=>daysRange(h.objFrom,h.objTo).forEach(d=>set.add(d)));
      ds=[...set].sort();
    }
    cur=perfectDaysOf(hs,ds);
  }
  else{
    // auto: los hábitos con período se miden contra TODOS los días del rango
    // (para estar al 100% hay que cumplirlos todos); el resto, contra lo transcurrido
    let sum=0,tot=0,remaining=0,marks=0;
    hs.forEach(h=>{
      if(hasWin(h)){
        const all=daysRange(h.objFrom,h.objTo).filter(d=>applies(h,d));
        tot+=all.length;
        all.forEach(d=>{const sc=score(h,d);sum+=sc;marks+=sc;if(d>t)remaining+=1-sc});
      }else{
        const r=rangeStats([h],daysNow);tot+=r.tot;sum+=r.sum;
      }
    });
    cur=tot?sum/tot*100:0;target=100;
    if(hs.some(hasWin)) win={tot,sum,remaining,marks};
  }
  const pct=target>0?Math.max(0,Math.min(100,Math.round(cur/target*100))):0;
  // fecha "efectiva" de cierre: la del objetivo o, si no tiene, el fin del último período de hábito
  let effDeadline=node.deadline||null;
  if(!effDeadline){
    const ends=hs.filter(hasWin).map(h=>h.objTo).sort();
    if(ends.length) effDeadline=ends[ends.length-1];
  }
  let daysLeft=null,weekly=null,daily=null,late=false;
  const rest=Math.max(0,target-cur);
  if(effDeadline){
    daysLeft=Math.round((fromIso(effDeadline)-today())/86400000);
    late=daysLeft<0&&pct<100;
    if(!win){
      const wl=Math.max(0,daysLeft)/7;
      weekly=rest<=0?0:(wl>=.15?rest/wl:rest);
      daily=rest<=0?0:(daysLeft>0?rest/daysLeft:null);        // null = ya no hay margen (venció)
    }
  }
  // ritmo de los últimos 7 días (o desde que arrancó, si es más reciente), para comparar
  let pace=null,paceDaily=null,paceDays=0;
  const w7all=daysRange(iso(addDays(today(),-6)),t);
  const w7=w7all.filter(d=>d>=start);
  if(node.mode==="auto"){
    if(w7.length||win){
      let sc=0,c=0;const set=new Set();
      hs.forEach(h=>w7all.forEach(d=>{
        const ok=hasWin(h)?(applies(h,d)&&inWin(h,d)):(d>=start&&counts(h,d));
        if(ok){c++;sc+=score(h,d);set.add(d)}
      }));
      pace=c?Math.round(sc/c*100):0;paceDaily=pace;paceDays=set.size;
    }
  }else if(w7.length){
    if(node.mode==="sum"){
      let s=0;hs.forEach(h=>w7.forEach(d=>{if(!hasWin(h)||inWin(h,d))s+=val(h,d)}));
      pace=s;paceDaily=s/w7.length;
      paceDays=w7.filter(d=>hs.some(h=>val(h,d)>0&&(!hasWin(h)||inWin(h,d)))).length;
    }else{
      pace=perfectDaysOf(hs,w7);paceDaily=pace/w7.length;
      paceDays=w7.filter(d=>hs.some(h=>applies(h,d)&&(!hasWin(h)||inWin(h,d)))).length;
    }
  }
  return {hs,cur,target,pct,daysLeft,weekly,daily,late,pace,paceDaily,paceDays,st,daysNow,daysAll,rest,effDeadline,win};
}
// proyección: si el historial reciente alcanza, estima dónde vas a estar
// el día del límite si seguís al ritmo actual. Nunca inventa datos: si no
// hay al menos unos días de registro reciente, directamente no proyecta.
function projectNode(o,st){
  if(o.mode==="manual") return null;
  if(!st.effDeadline||st.daysLeft==null||st.daysLeft<=0) return null;
  if(st.pct>=100) return null;
  if(st.paceDaily==null||st.paceDays<3) return null;          // historial insuficiente
  let projected;
  if(o.mode==="auto"){
    if(st.win){
      // con períodos: lo ya cumplido + (ritmo reciente x lo que falta cumplir) sobre el total del período
      const w=st.win;
      projected=w.tot?(w.sum+st.paceDaily/100*w.remaining)/w.tot*100:0;
    }else{
      const elapsed=st.daysNow.length||1;
      projected=(st.cur*elapsed+st.paceDaily*st.daysLeft)/(elapsed+st.daysLeft);
    }
  }else{
    projected=st.cur+st.paceDaily*st.daysLeft;
  }
  projected=Math.max(0,projected);
  const pct=st.target>0?Math.round(Math.min(999,projected/st.target*100)):0;
  return {projected,pct,onTrack:pct>=100};
}

function goalStats(g){

/* ------------ rachas ------------ */
function streakInfo(h){
  const t=iso(today());
  const first=h.since||t;
  const days=first<=t?daysRange(first,t):[t];
  let run=0,runStart=null,best=0,bs=null,be=null,lastDone=null,totalDone=0;
  days.forEach(d=>{
    if(!applies(h,d))return;
    if(done(h,d)){
      if(!runStart)runStart=d;
      run++;lastDone=d;totalDone++;
      if(run>best){best=run;bs=runStart;be=d}
    }else if(d!==t){run=0;runStart=null}    // hoy todavía no corta la racha
  });
  return {cur:run,curStart:runStart,best,bs,be,first,lastDone,totalDone,
          pending:applies(h,t)&&!done(h,t)};
}
// racha de días perfectos (todo lo del día cumplido)
function globalStreak(){
  const hs=habitsOf();
  if(!hs.length) return {cur:0,best:0,bs:null,be:null,first:null};
  const t=iso(today());
  let first=t;hs.forEach(h=>{if(h.since&&h.since<first)first=h.since});
  const days=first<=t?daysRange(first,t):[t];
  let run=0,runStart=null,best=0,bs=null,be=null;
  days.forEach(d=>{
    const act=hs.filter(h=>counts(h,d));
    const ok=act.length&&act.every(h=>done(h,d));
    if(ok){if(!runStart)runStart=d;run++;if(run>best){best=run;bs=runStart;be=d}}
    else if(d!==t&&act.length){run=0;runStart=null}
  });
  return {cur:run,best,bs,be,first};
}

function weeklySeries(n,h){
  const vals=[],labs=[];
  for(let i=n-1;i>=0;i--){
    const d=addDays(startWeek(new Date()),-7*i),w=weekDays(d);
    vals.push(h?habitStats(h,w).pct:rangeStats(habitsOf(),w).pct);
    labs.push(i===0?"hoy":fromIso(iso(d)).getDate()+"/"+(d.getMonth()+1));
  }
  return {vals,labs};
}

/* ------------ promedio por día de la semana ------------ */
function weekdayAvg(weeks){
  const res=Array.from({length:7},()=>({sum:0,n:0}));
  for(let i=0;i<weeks;i++){
    weekDays(addDays(new Date(),-7*i)).forEach(d=>{
      const st=rangeStats(habitsOf(),[d]);
      if(!st.tot)return;
      const w=dow(fromIso(d));
      res[w].sum+=st.pct;res[w].n++;
    });
  }
  return res.map((r,i)=>({d:i,pct:r.n?Math.round(r.sum/r.n):null,n:r.n}));
}

// bloques de 4 semanas dentro del mes (1-7, 8-14, 15-21, 22-fin)
function monthBlocks(d){
  const days=monthDays(d),out=[];
  for(let i=0;i<4;i++) out.push(days.slice(i*7, i===3?days.length:i*7+7));
  return out;
}

function donut(pct,color,size){
  const st=Math.max(7,Math.round(size*.13)), r=(size-st)/2, c=2*Math.PI*r;
  const off=c*(1-Math.max(0,Math.min(1,pct/100)));
  const d=el("div","donut");d.style.width=size+"px";d.style.height=size+"px";
  d.innerHTML='<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" aria-hidden="true">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--panel-2)" stroke-width="'+st+'"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+st+
    '" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+size/2+' '+size/2+')"/></svg>';
  const b=el("b","",pct+"%");b.style.fontSize=Math.round(size*.26)+"px";d.appendChild(b);
  return d;
}
function pie(parts,size){
  const tot=parts.reduce((a,p)=>a+p.value,0);
  const d=el("div","pie");d.style.width=size+"px";d.style.height=size+"px";
  if(!tot){d.style.background="var(--panel-2)";return d}
  let acc=0;const stops=parts.map(p=>{
    const a=acc/tot*100;acc+=p.value;return p.color+" "+a.toFixed(2)+"% "+(acc/tot*100).toFixed(2)+"%";
  });
  d.style.background="conic-gradient("+stops.join(",")+")";
  return d;
}
function weekDays(d){const s=startWeek(d);return Array.from({length:7},(_,i)=>iso(addDays(s,i)))}
function monthDays(d){
  const y=d.getFullYear(),m=d.getMonth(),n=new Date(y,m+1,0).getDate();
  return Array.from({length:n},(_,i)=>iso(new Date(y,m,i+1)));
}
function streak(h){
  let n=0,d=today();
  if(!applies(h,iso(d))||!done(h,iso(d))) { if(done(h,iso(d))) {} else d=addDays(d,-1); }
  for(let i=0;i<400;i++){
    const s=iso(d);
    if(h.since&&s<h.since) break;
    if(applies(h,s)){ if(done(h,s)) n++; else break; }
    d=addDays(d,-1);
  }
  return n;
}
function totalHours(h){
  let t=0;for(const k in state.log){if(k.startsWith(h.id+"|"))t+=state.log[k];}

let _storageWarned=false;
function persist(){
  try{
    // antes de pisar el dato principal, si el que hay ahí guardado es válido
    // lo dejamos como backup automático: así, si algo corta la escritura
    // siguiente a mitad de camino, loadLocal() todavía puede recuperar algo.
    const prevRaw=localStorage.getItem(KEY);
    if(prevRaw&&safeParseState(prevRaw)) localStorage.setItem(KEY+"_auto",prevRaw);
    localStorage.setItem(KEY,JSON.stringify(state));
  }catch(e){

    // disponible: avisamos una sola vez en vez de fallar en silencio.
    if(!_storageWarned){_storageWarned=true;try{toast("No se pudo guardar en este dispositivo (almacenamiento lleno o bloqueado)")}catch(e2){}}

/* ====================== sincronización con Google Drive ======================
   Reemplaza (o complementa) la sincronización propia de Claude (window.claude
   "db", más arriba) por una que usa el Google Drive del usuario. Guarda todo
   el estado en un único archivo JSON dentro de la carpeta privada de datos de
   la app en su Drive (appDataFolder: no se ve entre los archivos normales del

   PARA ACTIVARLO hacen falta dos cosas, una sola vez:
   1) Reemplazar DRIVE_CLIENT_ID de abajo por el Client ID que te da Google

   2) Que esta página esté servida por https (no funciona abierta como

      el hosting que elijas (GitHub Pages, Vercel, Netlify, etc.), y esa
      misma URL tiene que estar cargada como "origen autorizado" en el
      Client ID de Google Cloud.
   Si DRIVE_CLIENT_ID no se reemplaza, todo este bloque queda inactivo en
   silencio y la app sigue funcionando normal, solo con localStorage. */
const DRIVE_CLIENT_ID = "398301510569-0lpvdisdiilaag1gdvk7h9323ehfl55l.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.appdata";
const DRIVE_FILE_NAME = "agenik-datos.json";
const DRIVE_TOKEN_KEY = KEY + "_drive_token";
const DRIVE_FILEID_KEY = KEY + "_drive_fileid";
const DRIVE_POLL_MS = 4000; // revisar cambios del otro dispositivo cada 4 segundos

let driveTokenClient = null;
let driveAccessToken = null;
let driveTokenExpiry = 0;
let driveFileId = null;
let driveBusy = false;
let drivePullBusy = false;
let driveLastForegroundCheck = 0;
let drivePendingPush = false;
let drivePollTimer = null;
let driveStatusListeners = [];

function driveConfigured(){
  return DRIVE_CLIENT_ID && DRIVE_CLIENT_ID.indexOf("TU_CLIENT_ID")!==0;
}
function driveConnected(){
  return !!driveAccessToken && Date.now() < driveTokenExpiry;
}
function driveOnStatusChange(fn){ driveStatusListeners.push(fn); }
function driveNotifyStatus(){ driveStatusListeners.forEach(fn=>{ try{fn()}catch(e){} }); }

function initDrive(){
  if(!driveConfigured()) return;
  const raw=localStorage.getItem(DRIVE_TOKEN_KEY);
  if(raw){
    try{
      const saved=JSON.parse(raw);
      if(saved&&saved.token&&saved.expiry>Date.now()){
        driveAccessToken=saved.token;
        driveTokenExpiry=saved.expiry;
      }
    }catch(e){}
  }
  driveFileId=localStorage.getItem(DRIVE_FILEID_KEY)||null;

  function trySetup(){
    if(!(window.google&&google.accounts&&google.accounts.oauth2)){ setTimeout(trySetup,300); return; }
    driveTokenClient=google.accounts.oauth2.initTokenClient({
      client_id:DRIVE_CLIENT_ID,
      scope:DRIVE_SCOPE,
      callback:(resp)=>{
        if(resp&&resp.access_token){
          driveAccessToken=resp.access_token;
          driveTokenExpiry=Date.now()+((resp.expires_in||3500)*1000);
          try{localStorage.setItem(DRIVE_TOKEN_KEY,JSON.stringify({token:driveAccessToken,expiry:driveTokenExpiry}))}catch(e){}
          driveNotifyStatus();
          driveAfterConnect();
        }
      },
      error_callback:()=>{ driveNotifyStatus(); }
    });
    // si ya habia una sesion valida guardada, intenta reanudar la
    // sincronizacion sin pedir nada de nuevo
    if(driveConnected()) driveAfterConnect();
  }
  trySetup();
}

function driveConnect(){
  if(!driveTokenClient){ toast("Todavía se está preparando la conexión con Drive, esperá un segundo"); return; }
  driveTokenClient.requestAccessToken({prompt:driveAccessToken?"":"consent"});
}
function driveDisconnect(){
  const tok=driveAccessToken;
  driveAccessToken=null; driveTokenExpiry=0;
  localStorage.removeItem(DRIVE_TOKEN_KEY);
  clearInterval(drivePollTimer); drivePollTimer=null;
  driveNotifyStatus();
  if(tok&&window.google&&google.accounts&&google.accounts.oauth2){
    try{ google.accounts.oauth2.revoke(tok,()=>{}); }catch(e){}
  }
}
function driveAfterConnect(){
  pullDrive().finally(()=>{ pushDrive(); });
  clearInterval(drivePollTimer);
  drivePollTimer=setInterval(pullDrive,DRIVE_POLL_MS);
}

async function driveFetch(url,options){
  if(!driveConnected()) throw new Error("no-token");
  options=options||{};
  options.headers=Object.assign({},options.headers,{Authorization:"Bearer "+driveAccessToken});
  const r=await fetch(url,options);
  if(r.status===401){
    // token vencido: se limpia y hay que reconectar (el usuario ve el
    // boton "Conectar con Google Drive" de nuevo)
    driveAccessToken=null; driveTokenExpiry=0;
    localStorage.removeItem(DRIVE_TOKEN_KEY);
    driveNotifyStatus();
    throw new Error("token-expirado");
  }
  return r;
}

async function driveFindFileId(){
  if(driveFileId) return driveFileId;
  const q=encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const r=await driveFetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)`);
  const d=await r.json();
  if(d.files&&d.files.length){
    driveFileId=d.files[0].id;
    localStorage.setItem(DRIVE_FILEID_KEY,driveFileId);
  }
  return driveFileId;
}

async function pullDrive(){
  if(!driveConnected()||drivePullBusy) return;
  drivePullBusy=true;
  try{
    const id=await driveFindFileId();
    if(!id) return; // todavia no hay nada guardado en Drive
    const r=await driveFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
    const remote=await r.json();
    if(remote&&(remote.updatedAt||0)>(state.updatedAt||0)&&Array.isArray(remote.habits)){
      applyState(remote);migrate();
      try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
      buildNav();render();applyMascot();applyTheme();applyBg();applyBarSkin();
      toast("Datos actualizados desde Google Drive");
    }
  }catch(e){ /* sin conexion o token vencido: se reintenta en el proximo poll */ }
  finally{drivePullBusy=false}
}

async function pushDrive(){
  if(!driveConnected()) return;
  if(driveBusy){drivePendingPush=true;return}
  driveBusy=true;
  try{
    const id=await driveFindFileId();
    const body=JSON.stringify(state);
    if(id){
      await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{
        method:"PATCH",
        headers:{"Content-Type":"application/json"},
        body
      });
    }else{
      const boundary="agenikbound";
      const metadata={name:DRIVE_FILE_NAME,parents:["appDataFolder"]};
      const multipartBody=
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
      const r=await driveFetch(`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id`,{
        method:"POST",
        headers:{"Content-Type":`multipart/related; boundary=${boundary}`},
        body:multipartBody
      });
      const d=await r.json();
      if(d.id){ driveFileId=d.id; localStorage.setItem(DRIVE_FILEID_KEY,driveFileId); }
    }
  }catch(e){ /* se reintenta en el proximo guardado o en el proximo poll */ }
  driveBusy=false;
  if(drivePendingPush){drivePendingPush=false;pushDrive()}
}
